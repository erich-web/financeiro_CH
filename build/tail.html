<script>/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sum = a => a.reduce((x, y) => x + y, 0);
const round2 = v => Math.round(v * 100) / 100;
const fmt = (v, d = 0) => {
  const n = Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  return v < 0 ? '(' + n + ')' : n;
};
const fmtK = v => {
  const a = Math.abs(v);
  const s = a >= 1e6 ? (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi'
    : a >= 1000 ? (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil'
      : a.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  return (v < 0 ? '-' : '') + 'R$ ' + s;
};
const pct = (a, b) => b ? ((a / b) * 100).toFixed(1).replace('.', ',') + '%' : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icons = () => { try { feather.replace(); } catch (e) {} };
const hoje = () => new Date().toLocaleDateString('pt-BR');

const C = { blue: '#2563eb', navy: '#1e293b', sky: '#60a5fa', emerald: '#10b981', amber: '#f59e0b', red: '#ef4444', slate: '#94a3b8', light: '#cbd5e1', indigo: '#6366f1' };

Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#64748b';
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.plugins.legend.labels.boxHeight = 10;
Chart.defaults.plugins.legend.labels.padding = 14;
Chart.defaults.plugins.tooltip.backgroundColor = '#0f172a';
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.cornerRadius = 6;
Chart.defaults.plugins.tooltip.titleFont = { weight: '600' };
const gridOpt = { color: '#f1f5f9' };
const tipK = { callbacks: { label: c => ' ' + c.dataset.label + ': R$ ' + c.parsed.y.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' } };
const tipKx = { callbacks: { label: c => ' R$ ' + c.parsed.x.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' } };
const CH = {};
const mk = (id, cfg) => { if (CH[id]) CH[id].destroy(); CH[id] = new Chart($('#' + id), cfg); return CH[id]; };

let toastT;
const toast = (msg, icon = 'check') => {
  const t = $('#toast');
  t.innerHTML = '<i data-feather="' + icon + '" class="w-4 h-4"></i>' + esc(msg);
  t.classList.remove('hidden'); t.classList.add('flex'); icons();
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.add('hidden'); t.classList.remove('flex'); }, 2600);
};

const kpiCard = (label, value, sub, accent) => '<div class="card card-body">' +
  '<div class="kpi-label">' + label + '</div>' +
  '<div class="kpi-value' + (accent ? ' ' + accent : '') + '">' + value + '</div>' +
  (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';

/* anexos: guardados como data URL dentro do próprio painel */
const MAX_MB = 4;
function lerArquivo(input) { return lerArquivoDireto(input.files && input.files[0]); }
function lerArquivoDireto(f) {
  return new Promise(resolve => {
    if (!f) return resolve(null);
    if (f.size > MAX_MB * 1024 * 1024) {
      toast('Arquivo acima de ' + MAX_MB + ' MB. Use o link externo.', 'alert-circle');
      return resolve({ nome: f.name, tamanho: f.size, dados: null });
    }
    const r = new FileReader();
    r.onload = () => resolve({ nome: f.name, tamanho: f.size, dados: r.result });
    r.onerror = () => resolve(null);
    r.readAsDataURL(f);
  });
}
const anexoHTML = (arq, link) => {
  let h = '';
  if (arq && arq.dados) h += '<a href="' + arq.dados + '" download="' + esc(arq.nome) + '" class="text-blue-600 hover:underline">' + esc(arq.nome) + '</a>';
  else if (arq) h += '<span class="text-slate-400">' + esc(arq.nome) + ' (não anexado)</span>';
  if (link) h += (h ? ' · ' : '') + '<a href="' + esc(link) + '" target="_blank" rel="noopener" class="text-blue-600 hover:underline">link externo</a>';
  return h;
};

/* ============ estado ============ */
let DB = null;   // preenchido por montarDB() depois do login; nada de dados no arquivo
let deals = [];   // só dá para copiar de DB depois que DB existe — ver bootPainel
let votes = {};
let userAtas = [];
let userDocs = [];
let pipeUpdated = null;
let carregadoEm = null;
let dreView = 'cfo', dq = '', df = 'all';
let periodo = null;   // {ini:'2026-01', fim:'2026-07'}

/* ---- período: chaves, rótulos e recortes ---- */
const MES3 = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
const rotulo = (k, comAno) => MES3[+k.slice(5) - 1] + (comAno ? '/' + k.slice(2, 4) : '');
const rotuloLongo = k => MES3[+k.slice(5) - 1].toLowerCase() + '/' + k.slice(0, 4);
function chavesCaixa() { return DB.serie_caixa.map(m => m.k); }
function chavesTodas() { return [...new Set([...chavesCaixa(), ...(DB.dre.chaves || [])])].sort(); }
function limites() { const t = chavesTodas(); return { min: t[0], max: t[t.length - 1] }; }
function periodoAtual() {
  const l = limites();
  if (!periodo) return { ini: l.min, fim: l.max };
  return { ini: periodo.ini < l.min ? l.min : periodo.ini, fim: periodo.fim > l.max ? l.max : periodo.fim };
}
const dentro = k => { const p = periodoAtual(); return k >= p.ini && k <= p.fim; };
function idxDre() { return (DB.dre.chaves || []).map((k, i) => dentro(k) ? i : -1).filter(i => i >= 0); }
function serieCaixaFiltrada() { return DB.serie_caixa.filter(m => dentro(m.k)); }
const multiAno = ks => new Set(ks.map(k => k.slice(0, 4))).size > 1;
function fatiar(obj, idx) {
  const o = {};
  for (const [k, v] of Object.entries(obj)) {
    if (Array.isArray(v)) o[k] = idx.map(i => v[i]);
    else if (v && typeof v === 'object') o[k] = fatiar(v, idx);
    else o[k] = v;
  }
  return o;
}
function dreFiltrada() {
  const idx = idxDre();
  const d = fatiar(DB.dre, idx);
  d.chaves = idx.map(i => DB.dre.chaves[i]);
  d.months = d.chaves.map(k => rotulo(k, multiAno(d.chaves)));
  return d;
}
function coberturaDre() {
  const p = periodoAtual(), ch = DB.dre.chaves || [];
  const dentroCh = ch.filter(k => k >= p.ini && k <= p.fim);
  return { p, ch, dentroCh, parcial: dentroCh.length > 0 && ch.length > 0 && (p.ini < ch[0] || p.fim > ch[ch.length - 1]) };
}
function faixa(el, texto, comLink) {
  const box = $(el);
  if (!texto) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.classList.remove('hidden');
  box.innerHTML = '<div class="rounded-xl border border-amber-200 bg-amber-50 p-4 flex gap-3">' +
    '<i data-feather="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>' +
    '<p class="text-sm text-amber-900 leading-relaxed">' + texto +
    (comLink ? ' <button class="ir-fluxo underline font-medium">Ver o fluxo de caixa do período completo.</button>' : '') + '</p></div>';
  const b = box.querySelector('.ir-fluxo');
  if (b) b.addEventListener('click', () => go('fluxo'));
  icons();
}
function avisoDre() {
  const c = coberturaDre();
  if (!c.parcial) return '';
  const fim = c.dentroCh[c.dentroCh.length - 1];
  return 'O período escolhido vai de ' + rotuloLongo(c.p.ini) + ' a ' + rotuloLongo(c.p.fim) +
    ', mas as demonstrações de resultado disponíveis vão de ' + rotuloLongo(c.ch[0]) + ' a ' + rotuloLongo(c.ch[c.ch.length - 1]) +
    '. Os valores desta tela cobrem ' + rotuloLongo(c.dentroCh[0]) + ' a ' + rotuloLongo(fim) + '.' +
    (DB.meta.nota_dre ? ' ' + DB.meta.nota_dre : '');
}
function textoPeriodo() {
  const p = periodoAtual(), l = limites();
  if (p.ini === l.min && p.fim === l.max) return 'Todo o histórico';
  if (p.ini === p.fim) return rotuloLongo(p.ini);
  const anoIni = p.ini.slice(0, 4), anoFim = p.fim.slice(0, 4);
  if (anoIni === anoFim) {
    const doAno = chavesTodas().filter(k => k.slice(0, 4) === anoIni);
    if (p.ini === doAno[0] && p.fim === doAno[doAno.length - 1]) return anoIni;
  }
  return rotuloLongo(p.ini) + ' a ' + rotuloLongo(p.fim);
}

/* ============ navegação ============ */
const TITLES = { visao: 'Visão geral', dre: 'DRE gerencial', balanco: 'Balanço e caixa', fluxo: 'Fluxo de caixa', pipeline: 'Pipeline comercial', governanca: 'Atas e deliberações', pendencias: 'Pendências', docs: 'Central de documentos', estacionamento: 'Extra contábil — estacionamento', atualizacoes: 'Atualizações' };
const sidebar = () => $('#sidebar'), backdrop = () => $('#backdrop');
function openNav() { sidebar().classList.remove('-translate-x-full'); backdrop().classList.remove('hidden'); }
function closeNav() { sidebar().classList.add('-translate-x-full'); backdrop().classList.add('hidden'); }
$('#btn-menu').addEventListener('click', openNav);
$('#btn-close-nav').addEventListener('click', closeNav);
$('#backdrop').addEventListener('click', closeNav);

function go(p) {
  $$('.page').forEach(s => s.classList.toggle('active', s.id === p));
  $$('#nav .nav-item').forEach(a => a.classList.toggle('active', a.dataset.p === p));
  $('#crumb').textContent = TITLES[p];
  closeNav();
  try { history.replaceState(null, '', '#' + p); } catch (e) {}
  window.scrollTo({ top: 0 });
}
$$('#nav .nav-item').forEach(a => a.addEventListener('click', () => go(a.dataset.p)));

/* ============ 1. visão geral ============ */
function renderVisao() {
  const d = dreFiltrada(), M = d.months, temDre = M.length > 0;
  const caixaF = serieCaixaFiltrada();
  const rb = sum(d.receita_bruta), rl = sum(d.receita_liquida), eb = sum(d.ebitda), res = sum(d.resultado);
  $('#visao-sub').textContent = DB.meta.resumo_visao;
  $('#crumb-sub').textContent = textoPeriodo();
  $('#side-comp').textContent = DB.meta.competencia.toLowerCase();
  $('#stamp-cont').innerHTML = '<i data-feather="check-circle" class="w-3 h-3"></i>' + esc(DB.meta.fonte_contabil);

  faixa('#aviso-visao', avisoDre(), true);
  const chavesMix = DB.mix.chaves || DB.dre.chaves || [];
  const efetivo = temDre ? (d.chaves.length === 1 ? rotuloLongo(d.chaves[0]) : rotuloLongo(d.chaves[0]) + ' a ' + rotuloLongo(d.chaves[d.chaves.length - 1])) : '';
  $('#hint-overview').textContent = 'Competência · R$ mil' + (temDre ? ' · ' + efetivo : '');
  const kMix = chavesMix.filter(k => dentro(k));
  $('#hint-mix').textContent = 'Caixa' + (kMix.length
    ? ' · ' + (kMix.length === 1 ? rotuloLongo(kMix[0]) : rotuloLongo(kMix[0]) + ' a ' + rotuloLongo(kMix[kMix.length - 1]))
    : ' · sem abertura no período');
  const semDre = 'Sem DRE neste período';
  $('#kpis').innerHTML = [
    kpiCard('Receita bruta', temDre ? fmtK(rb) : '—', temDre ? 'Locação de espaços, patrocínio e eventos' : semDre),
    kpiCard('EBITDA', temDre ? fmtK(eb) : '—', temDre ? 'Margem de ' + pct(eb, rl) + ' sobre a receita líquida' : semDre, 'text-emerald-600'),
    kpiCard('Resultado líquido', temDre ? fmtK(res) : '—', temDre ? 'Depois de depreciação, juros e IRPJ/CSLL' : semDre),
    kpiCard('Caixa em ' + (DB.meta.caixa_data || DB.meta.balanco_data).slice(0, 5), fmtK(DB.meta.caixa_total != null ? DB.meta.caixa_total : DB.balanco.disponibilidades), 'Sendo ' + fmtK(DB.meta.caixa_aplicado || DB.balanco.aplicacoes) + ' aplicados no Itaú', 'text-emerald-600'),
    kpiCard('Contratado a receber', fmtK(sum(DB.receber.map(r => r[2]))), DB.receber.length + ' parcelas em contrato'),
    kpiCard('Aportes no período', fmtK(sum(caixaF.map(m => m.aporte))), caixaF.length + (caixaF.length === 1 ? ' mês de caixa' : ' meses de caixa'))
  ].join('');

  mk('ch-overview', {
    type: 'bar',
    data: {
      labels: M,
      datasets: [
        { type: 'bar', label: 'Receita líquida', data: d.receita_liquida.map(v => v / 1000), backgroundColor: C.blue, borderRadius: 4, barPercentage: .6, order: 2 },
        { type: 'line', label: 'EBITDA', data: d.ebitda.map(v => v / 1000), borderColor: C.emerald, backgroundColor: C.emerald, borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6, tension: .3, order: 1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom' }, tooltip: tipK },
      scales: { x: { grid: { display: false } }, y: { grid: gridOpt, border: { display: false }, ticks: { callback: v => 'R$ ' + v + 'k' } } }
    }
  });

  const idxMix = chavesMix.map((k, i) => dentro(k) ? i : -1).filter(i => i >= 0);
  const mx = fatiar(DB.mix, idxMix);
  const items = [
    ['Locação de espaços', sum(mx.locacao), C.blue],
    ['Patrocínio', sum(mx.patrocinio), C.emerald],
    ['Comissionamento de buffet e estacionamento', sum(mx.comissionamento), C.indigo],
    ['Recuperação de despesas', sum(mx.recup_energia), C.sky],
    ['Eventos próprios', sum(mx.eventos), C.amber],
    ['Repasses não tributáveis', sum(mx.nao_tributavel), C.light]
  ];
  const tot = sum(items.map(i => i[1]));
  mk('ch-mix', {
    type: 'doughnut',
    data: { labels: items.map(i => i[0]), datasets: [{ data: items.map(i => i[1]), backgroundColor: items.map(i => i[2]), borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '64%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + c.label + ': R$ ' + c.parsed.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' (' + pct(c.parsed, tot) + ')' } } } }
  });
  $('#mix-legend').innerHTML = items.map(i =>
    '<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:' + i[2] + '"></span>' +
    '<span class="text-slate-600 flex-1 leading-tight">' + i[0] + '</span>' +
    '<span class="font-semibold text-slate-900 tabular-nums">' + pct(i[1], tot) + '</span></div>').join('');

  const tone = { emerald: 'bg-emerald-50 text-emerald-600', blue: 'bg-blue-50 text-blue-600', amber: 'bg-amber-50 text-amber-600', red: 'bg-red-50 text-red-600', slate: 'bg-slate-100 text-slate-600' };
  $('#alerts').innerHTML = DB.alertas.map(a =>
    '<div class="flex gap-4 py-4 first:pt-0 last:pb-0">' +
    '<div class="w-9 h-9 rounded-lg grid place-items-center shrink-0 ' + (tone[a[1]] || tone.slate) + '"><i data-feather="' + a[0] + '" class="w-4 h-4"></i></div>' +
    '<div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><h3 class="text-sm font-semibold text-slate-900">' + esc(a[2]) + '</h3><span class="badge ' + a[5] + '">' + esc(a[4]) + '</span></div>' +
    '<p class="text-sm text-slate-600 mt-1.5 leading-relaxed">' + esc(a[3]) + '</p></div></div>').join('');

  $('#t-socios').innerHTML = '<tbody>' + DB.socios.map(s =>
    '<tr><td class="text-xs">' + esc(s[0]) + (s[1] > 1 ? ' <span class="badge badge-blue ml-1">' + s[1] + ' quotas</span>' : '') + '</td>' +
    '<td class="num text-xs ' + (s[3].startsWith('Pend') ? 'text-amber-600 font-medium' : '') + '">' + (s[3].startsWith('Pend') ? 'pendente' : 'R$ ' + fmt(s[2])) + '</td></tr>').join('') + '</tbody>';
  icons();
}

/* ============ 2. DRE ============ */
const NM = {
  aluguel_conexidades: 'Aluguel do imóvel — Conexidades', eventos: 'Buffet e produção de eventos', feiras: 'Serviços de feiras e eventos',
  loc_equip: 'Locação de máquinas e equipamentos', ecad: 'Direitos autorais (ECAD)', decoracao: 'Decoração',
  serv_pf: 'Serviços de pessoa física em eventos', producao_eventos_proprios_est: 'Produção do Baile de Gala e Carnaval (estimado)',
  assessoria_comercial_mkt: 'Gerência comercial e marketing', publicidade: 'Publicidade e propaganda', redes: 'Redes sociais', com_visual: 'Comunicação visual',
  utilidades: 'Energia, água, gás e telefone', conservacao: 'Elevadores, ar-condicionado e reparos', limpeza: 'Limpeza e zeladoria',
  seguranca: 'Segurança e monitoramento', serv_manut: 'Serviços de manutenção', peq_materiais: 'Materiais de manutenção',
  mat_limpeza: 'Material de limpeza', tributos_iptu: 'IPTU e taxas'
};
function renderDre() {
  const d = dreFiltrada(), M = d.months, n = M.length;
  faixa('#aviso-dre', n ? avisoDre() : '', true);
  $('#dre-vazio').classList.toggle('hidden', n > 0);
  $('#dre-conteudo').classList.toggle('hidden', n === 0);
  if (!n) { icons(); return; }
  const rl = sum(d.receita_liquida), rb = sum(d.receita_bruta);
  const mc = sum(d.margem_contrib);
  const fixo = (sum(d.pessoal) + sum(d.ocupacao) + sum(d.admin)) / n;
  const ult = Math.min(2, n);
  const e2 = sum(d.ebitda.slice(n - ult)), r2 = sum(d.receita_liquida.slice(n - ult));
  const trib = -(sum(d.deducoes) + sum(d.ir_csll));
  $('#dre-kpis').innerHTML = [
    kpiCard('Margem de contribuição', fmtK(mc), pct(mc, rl) + ' da receita líquida, depois dos custos diretos de evento'),
    kpiCard('Custo de manter a casa', fmtK(Math.abs(fixo)) + '/mês', 'Pessoal, ocupação e administrativo, média do período'),
    kpiCard(ult === 1 ? 'Margem EBITDA do mês' : 'Margem EBITDA nos dois últimos meses', pct(e2, r2), 'Últimos meses do período escolhido', 'text-emerald-600'),
    kpiCard('Carga tributária efetiva', pct(trib, rb), 'PIS, COFINS, IRPJ e CSLL sobre a receita bruta')
  ].join('');

  const NOTE = {
    cfo: 'Reclassificação gerencial sobre a DRE contábil da ' + DB.meta.fonte_contabil + '. Os custos diretos de evento reúnem o aluguel do imóvel do Conexidades, buffet, decoração, locação de equipamentos, ECAD e serviços de pessoa física ligados a eventos. O excedente de assessoria e consultoria em janeiro e fevereiro (R$ 242 mil acima da média mensal de R$ 45 mil) foi tratado como produção do Baile de Gala e do Carnaval — é uma estimativa, e a contabilidade precisa abrir esses valores por centro de custo. Os totais de EBITDA e de resultado batem com o contábil.',
    contabil: 'Transcrição da DRE emitida pela Ascon Systems, conforme a ' + DB.meta.fonte_contabil + ', em regime de competência.'
  };
  const totalLabel = n === 1 ? 'Total' : M[0] + '–' + M[n - 1];

  function row(label, arr, cls, opt) {
    opt = opt || {};
    const t = sum(arr);
    return '<tr class="' + (cls || '') + '"' + (opt.key ? ' data-key="' + opt.key + '"' : '') + '>' +
      '<td class="min-w-[260px]">' + (opt.key ? '<span class="inline-flex items-center gap-1.5"><i data-feather="chevron-right" class="w-3.5 h-3.5 chev transition-transform"></i>' + label + '</span>' : label) + '</td>' +
      arr.map(v => '<td class="num' + (v < 0 ? ' neg' : '') + '">' + fmt(v) + '</td>').join('') +
      '<td class="num font-semibold' + (t < 0 ? ' neg' : '') + '">' + fmt(t) + '</td>' +
      '<td class="num text-slate-400">' + pct(t, rl) + '</td></tr>';
  }
  const detail = (obj, g) => Object.entries(obj).map(([k, arr]) => row(NM[k] || k, arr, 'row-detail hidden g-' + g)).join('');
  const head = '<thead><tr><th></th>' + M.map(m => '<th class="num">' + m + '</th>').join('') + '<th class="num">' + totalLabel + '</th><th class="num">% RL</th></tr></thead>';

  $('#dre-title').textContent = dreView === 'cfo' ? 'Demonstração do resultado — visão gerencial' : 'Demonstração do resultado — visão contábil';
  $('#dre-note').textContent = NOTE[dreView];
  let h = head + '<tbody>';
  if (dreView === 'cfo') {
    h += row('Receita bruta', d.receita_bruta)
      + row('(–) PIS e COFINS', d.deducoes)
      + row('Receita líquida', d.receita_liquida, 'row-sub')
      + row('(–) Custos diretos de evento', d.custos_eventos, 'cursor-pointer', { key: 'c' }) + detail(d.detalhe.custos, 'c')
      + row('Margem de contribuição', d.margem_contrib, 'row-sub')
      + '<tr class="row-group"><td colspan="' + (n + 3) + '">Custo de manter a casa aberta</td></tr>'
      + row('(–) Pessoal, encargos e benefícios', d.pessoal)
      + row('(–) Comercial e marketing', d.comercial, 'cursor-pointer', { key: 'm' }) + detail(d.detalhe.comercial, 'm')
      + row('(–) Ocupação e manutenção predial', d.ocupacao, 'cursor-pointer', { key: 'o' }) + detail(d.detalhe.ocupacao, 'o')
      + row('(–) Administrativo', d.admin)
      + row('EBITDA', d.ebitda, 'row-total')
      + row('(–) Depreciação', d.depreciacao)
      + row('(+) Receitas financeiras', d.rec_fin)
      + row('(–) Despesas financeiras', d.desp_fin)
      + row('(+) Outros resultados', d.outros)
      + row('Resultado antes do imposto', d.lair, 'row-sub')
      + row('(–) IRPJ e CSLL', d.ir_csll)
      + row('Resultado do período', d.resultado, 'row-total');
  } else {

/* ============ 4. fluxo ============ */
function renderFluxo() {
  const S = serieCaixaFiltrada(), n = S.length;
  const ks = S.map(m => m.k), ma = multiAno(ks);
  const meses = ks.map(k => rotulo(k, ma));
  const col = f => S.map(m => m[f]);
  const opIn = S.map(m => m.locacao + m.eventos + m.outras + m.repasses + m.rendimento);
  const opOut = S.map(m => m.impostos + m.pessoal + m.gerais);
  const op = opIn.map((v, i) => v - opOut[i]);
  const inv = col('investimento').map(v => -v), fin = col('aporte');
  const net = op.map((v, i) => v + inv[i] + fin[i]);
  const saldo = col('saldo');
  $('#period-label2').textContent = textoPeriodo();
  if (!n) {
    $('#fx-kpis').innerHTML = '<div class="card card-body sm:col-span-2 xl:col-span-4"><div class="kpi-label">Período sem movimento</div><div class="kpi-value">—</div><div class="kpi-sub">A série de caixa vai de julho de 2025 até o último fechamento.</div></div>';
    $('#fx-three').innerHTML = ''; $('#t-fluxo').innerHTML = '';
    if (CH['ch-fluxo']) { CH['ch-fluxo'].destroy(); delete CH['ch-fluxo']; }
    return;
  }

  $('#fx-kpis').innerHTML = [
    kpiCard('Entradas operacionais', fmtK(sum(opIn)), 'Locação, eventos, repasses e rendimentos'),
    kpiCard('Saídas operacionais', fmtK(-sum(opOut)), 'Despesas gerais, pessoal e impostos'),
    kpiCard('Geração operacional', fmtK(sum(op)), 'Caixa gerado pela operação', sum(op) > 0 ? 'text-emerald-600' : 'text-red-600'),
    kpiCard('Saldo final', fmtK(saldo[n - 1]), 'Conta corrente e aplicações em ' + rotuloLongo(ks[n - 1]))
  ].join('');
  $('#fx-title').textContent = 'Entradas, saídas e saldo · ' + textoPeriodo().toLowerCase();

  mk('ch-fluxo', {
    type: 'bar',
    data: {
      labels: meses, datasets: [
        { type: 'bar', label: 'Operacional', data: op.map(v => v / 1000), backgroundColor: C.emerald, stack: 'a' },
        { type: 'bar', label: 'Investimento', data: inv.map(v => v / 1000), backgroundColor: C.light, stack: 'a' },
        { type: 'bar', label: 'Aportes dos sócios', data: fin.map(v => v / 1000), backgroundColor: C.blue, stack: 'a' },
        { type: 'line', label: 'Saldo de caixa', data: saldo.map(v => v / 1000), borderColor: C.navy, backgroundColor: C.navy, borderWidth: 2.5, pointRadius: 4, tension: .3, yAxisID: 'y2' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom' }, tooltip: tipK },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, grid: gridOpt, border: { display: false }, ticks: { callback: v => 'R$ ' + v + 'k' } },
        y2: { position: 'right', grid: { display: false }, border: { display: false }, ticks: { callback: v => 'R$ ' + v + 'k' } }
      }
    }
  });

  const three = [['Operacional', sum(op), C.emerald], ['Investimento', sum(inv), C.slate], ['Financiamento', sum(fin), C.blue]];
  const mxv = Math.max(...three.map(t => Math.abs(t[1])));
  $('#fx-three').innerHTML = three.map(t =>
    '<div class="mb-4"><div class="flex justify-between text-xs mb-1.5"><span class="text-slate-600 font-medium">' + t[0] + '</span>' +
    '<span class="font-semibold tabular-nums ' + (t[1] < 0 ? 'text-red-600' : 'text-slate-900') + '">' + fmtK(t[1]) + '</span></div>' +
    '<div class="h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:' + (Math.abs(t[1]) / mxv * 100) + '%;background:' + t[2] + '"></div></div></div>').join('') +
    '<div class="flex justify-between pt-3 border-t border-slate-200 text-sm"><span class="text-slate-600 font-medium">Variação líquida</span><span class="font-bold tabular-nums">' + fmtK(sum(net)) + '</span></div>';

  const R = (l, arr, cls) => '<tr class="' + (cls || '') + '"><td class="min-w-[240px]">' + l + '</td>' +
    arr.map(v => '<td class="num' + (v < 0 ? ' neg' : '') + '">' + fmt(v) + '</td>').join('') +
    '<td class="num font-semibold">' + fmt(sum(arr)) + '</td></tr>';
  const G = t => '<tr class="row-group"><td colspan="' + (n + 2) + '">' + t + '</td></tr>';
  let h = '<thead><tr><th></th>' + meses.map(m => '<th class="num">' + m + '</th>').join('') + '<th class="num">Total</th></tr></thead><tbody>';

    R('(–) Despesas gerais', col('gerais').map(v => -v)) + R('(–) Pessoal', col('pessoal').map(v => -v)) +
    R('(–) Impostos', col('impostos').map(v => -v)) + R('Geração operacional', op, 'row-sub');
  h += G('Fluxo de investimento') + R('(–) Imóvel, mobiliário e equipamentos', inv, 'row-sub');
  h += G('Fluxo de financiamento') + R('Aportes dos sócios', fin, 'row-sub');
  h += R('Variação de caixa', net, 'row-total') + R('Saldo final', saldo);
  $('#t-fluxo').innerHTML = h + '</tbody>';
}

/* ============ filtro de período ============ */
function presets() {
  const l = limites(), t = chavesTodas(), anos = [...new Set(t.map(k => k.slice(0, 4)))].sort().reverse();
  const ult = k => t[Math.max(0, t.length - k)];
  const p = [['Todo o histórico (desde ' + rotuloLongo(l.min) + ')', l.min, l.max]];
  anos.forEach(a => p.push([a, t.find(k => k.slice(0, 4) === a), [...t].reverse().find(k => k.slice(0, 4) === a)]));
  p.push(['Últimos 3 meses', ult(3), l.max], ['Últimos 6 meses', ult(6), l.max], ['Último mês', l.max, l.max]);
  return p;
}
function abrirPeriodo() {
  const t = chavesTodas(), p = periodoAtual();
  const opts = sel => t.map(k => '<option value="' + k + '"' + (k === p[sel] ? ' selected' : '') + '>' + rotuloLongo(k) + '</option>').join('');
  $('#p-ini').innerHTML = opts('ini');
  $('#p-fim').innerHTML = opts('fim');
  $('#p-presets').innerHTML = presets().map(x =>
    '<button class="pp btn btn-ghost btn-sm' + (x[1] === p.ini && x[2] === p.fim ? ' !bg-blue-600 !text-white !border-blue-600' : '') +
    '" data-i="' + x[1] + '" data-f="' + x[2] + '">' + x[0] + '</button>').join('');
  $$('#p-presets .pp').forEach(b => b.addEventListener('click', () => {
    $('#p-ini').value = b.dataset.i; $('#p-fim').value = b.dataset.f; avisoPeriodo();
    $$('#p-presets .pp').forEach(x => x.classList.remove('!bg-blue-600', '!text-white', '!border-blue-600'));
    b.classList.add('!bg-blue-600', '!text-white', '!border-blue-600');
  }));
  avisoPeriodo();
  $('#modal-period').classList.remove('hidden');
}
function avisoPeriodo() {
  const i = $('#p-ini').value, f = $('#p-fim').value;
  const temDre = (DB.dre.chaves || []).some(k => k >= i && k <= f);
  const ch = DB.dre.chaves || [];
  const parcial = temDre && (i < ch[0] || f > ch[ch.length - 1]);
  $('#p-aviso').textContent = i > f
    ? 'A data inicial está depois da final. Ajuste antes de aplicar.'
    : !temDre
      ? 'Esse período não tem DRE: as demonstrações começam em ' + rotuloLongo(ch[0] || '2026-01') + '. O fluxo de caixa funciona normalmente.'
      : parcial
        ? 'O fluxo de caixa cobre o período inteiro. A visão geral e a DRE mostram de ' + rotuloLongo(ch.filter(k => k >= i && k <= f)[0]) + ' em diante, porque as demonstrações começam em ' + rotuloLongo(ch[0]) + '.'
        : 'Vale para a visão geral, a DRE e o fluxo de caixa. O balanço continua sendo a posição da última data fechada.';
}
const fecharPeriodo = () => $('#modal-period').classList.add('hidden');
$('#btn-period').addEventListener('click', abrirPeriodo);
$('#btn-period2').addEventListener('click', abrirPeriodo);
$('#p-close').addEventListener('click', fecharPeriodo);
$('#p-cancel').addEventListener('click', fecharPeriodo);
$('#p-ini').addEventListener('change', avisoPeriodo);
$('#p-fim').addEventListener('change', avisoPeriodo);
$('#p-save').addEventListener('click', () => {
  const ini = $('#p-ini').value, fim = $('#p-fim').value;

    kpiCard('Fechadas', fmtK(sum(closed.map(d => d.val))), closed.length + ' contratos', 'text-emerald-600'),
    kpiCard('Taxa de conversão', win, closed.length + ' ganhas e ' + lost.length + ' perdidas')

  const stamp = $('#pipe-stamp');

      '<div class="p-3 space-y-3">' + (list.length ? list.map(d =>
        '<div class="rounded-lg border ' + (d.ex ? 'border-dashed border-slate-300' : 'border-slate-200') + ' bg-white p-3 hover:border-blue-400 transition-colors" data-id="' + d.id + '">' +

        (d.evt ? '<div class="text-xs text-slate-500 mt-1 leading-snug">' + esc(d.evt) + '</div>' : '') +
        '<div class="flex items-center justify-between mt-2.5 text-xs">' +

        '<span class="font-semibold text-slate-900 tabular-nums">' + (d.val ? 'R$ ' + fmt(d.val) : '—') + '</span></div>' +
        (['fechada', 'perdida'].includes(d.st) ? '' :

function renderEstacionamento() {
  const E = DB.estacionamento;
  if (!E) return;
  /* A lista vazia é estado legítimo: acontece no primeiro mês, antes de
     qualquer lançamento chegar. Antes disso quebrava a aba, porque o
     aviso de "fora do período" lia E.meses[0].k sem haver mês nenhum. */
  const todos = Array.isArray(E.meses) ? E.meses : [];
  const meses = todos.filter(m => dentro(m.k));
  const itens = meses.flatMap(m => m.itens.map(i => ({ ...i, mes: m.nome, k: m.k })));
  const devido = sum(meses.map(m => m.devido));
  const quitado = sum(meses.map(m => m.pago));
  const saldo = round2(devido - quitado);
  const pagos = sum(itens.filter(i => i.st === 'Pago').map(i => i.valor));
  const pend = sum(itens.filter(i => i.st !== 'Pago').map(i => i.valor));
  const nPend = itens.filter(i => i.st !== 'Pago').length;

  faixa('#est-aviso',
    meses.length ? ''
      : !todos.length ? 'Ainda não há lançamentos do estacionamento neste painel.'
        : 'O controle do estacionamento começa em ' + rotuloLongo(todos[0].k) +
          ' e vai até ' + rotuloLongo(todos[todos.length - 1].k) +
          '. O período escolhido não alcança esses meses.',
    false);
  $('#est-kpis').innerHTML = !meses.length ? '' : [
    kpiCard('Devido pelo operador', fmtK(devido), meses.length + (meses.length === 1 ? ' mês de apuração' : ' meses de apuração') + ' · 50% da arrecadação'),
    kpiCard('Quitado em contas da casa', fmtK(quitado), itens.length + ' pagamentos diretos ao fornecedor'),
    kpiCard(saldo >= 0 ? 'Saldo a favor do Campos Hall' : 'Crédito do operador', fmtK(Math.abs(saldo)),
      saldo >= 0 ? 'Ainda a ser quitado em contas' : 'Pagou além do devido no período', saldo >= 0 ? 'text-amber-600' : 'text-emerald-600'),
    kpiCard('Pendente de pagamento', fmtK(pend), nPend ? nPend + (nPend === 1 ? ' conta ainda não paga' : ' contas ainda não pagas') : 'Tudo quitado no período', pend ? 'text-red-600' : '')
  ].join('');

  if (meses.length) {
    let ac = 0; const acum = meses.map(m => { ac = round2(ac + m.saldo); return ac; });
    mk('ch-est', {
      type: 'bar',
      data: {
        labels: meses.map(m => m.nome), datasets: [
          { type: 'bar', label: 'Devido pelo operador', data: meses.map(m => m.devido / 1000), backgroundColor: C.blue, borderRadius: 4 },
          { type: 'bar', label: 'Quitado em contas', data: meses.map(m => m.pago / 1000), backgroundColor: C.emerald, borderRadius: 4 },
          { type: 'line', label: 'Saldo acumulado', data: acum.map(v => v / 1000), borderColor: C.amber, backgroundColor: C.amber, borderWidth: 2.5, pointRadius: 4, tension: .3, yAxisID: 'y2' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom' }, tooltip: tipK },
        scales: {
          x: { grid: { display: false } },
          y: { grid: gridOpt, border: { display: false }, ticks: { callback: v => 'R$ ' + v + 'k' } },
          y2: { position: 'right', grid: { display: false }, border: { display: false }, ticks: { callback: v => 'R$ ' + v + 'k' } }
        }
      }
    });
  } else if (CH['ch-est']) { CH['ch-est'].destroy(); delete CH['ch-est']; }

  $('#est-resumo-hint').textContent = meses.length ? meses[0].nome + ' a ' + meses[meses.length - 1].nome : '—';
  $('#t-est-resumo').innerHTML = !meses.length ? '' :
    '<thead><tr><th>Competência</th><th>Base</th><th class="num">Devido</th><th class="num">Quitado</th><th class="num">Saldo</th></tr></thead><tbody>' +
    meses.map(m => '<tr><td class="font-medium text-slate-900">' + esc(m.nome) + '</td>' +
      '<td class="text-xs text-slate-500">' + esc(m.base) + '</td>' +
      '<td class="num">' + fmt(m.devido, 2) + '</td>' +
      '<td class="num">' + fmt(m.pago, 2) + '</td>' +
      '<td class="num ' + (m.saldo > 0 ? 'text-amber-600 font-medium' : m.saldo < 0 ? 'text-emerald-600' : '') + '">' + fmt(m.saldo, 2) + '</td></tr>').join('') +
    '<tr class="row-total"><td colspan="2">Total</td><td class="num">' + fmt(devido, 2) + '</td><td class="num">' + fmt(quitado, 2) + '</td><td class="num">' + fmt(saldo, 2) + '</td></tr></tbody>';

  $('#est-itens-hint').textContent = itens.length ? itens.length + ' lançamentos · ' + fmtK(pagos) + ' pagos e ' + fmtK(pend) + ' pendentes' : '—';
  const porMes = meses.filter(m => m.itens.length);
  $('#t-est').innerHTML = !itens.length ? '' :
    '<thead><tr><th>Fornecedor</th><th>Descrição</th><th>Vencimento</th><th class="num">R$</th><th>Situação</th></tr></thead><tbody>' +
    porMes.map(m => '<tr class="row-group"><td colspan="5">' + esc(m.nome) + ' · ' + m.itens.length +
      (m.itens.length === 1 ? ' conta' : ' contas') + ' · ' + fmtK(m.pago) + '</td></tr>' +
      m.itens.map(i => '<tr><td class="text-xs font-medium text-slate-900">' + esc(i.forn) + '</td>' +
        '<td class="text-xs text-slate-600">' + esc(i.desc) + (i.obs ? ' <span class="text-slate-400">(' + esc(i.obs) + ')</span>' : '') + '</td>' +
        '<td class="text-xs text-slate-500 tabular-nums">' + (i.venc || '—') + '</td>' +
        '<td class="num">' + fmt(i.valor, 2) + '</td>' +
        '<td><span class="badge ' + (i.st === 'Pago' ? 'badge-green' : 'badge-amber') + '">' + esc(i.st) + '</span></td></tr>').join('')
    ).join('') +
    '<tr class="row-total"><td colspan="3">Total quitado</td><td class="num">' + fmt(quitado, 2) + '</td><td></td></tr></tbody>';

  const naoTrib = 60195.83, foraDeTudo = 13103.22;
  $('#est-dre').innerHTML = [
    ['file-text', 'blue', fmtK(quitado) + ' fora das demonstrações',

    ['eye-off', 'red', 'Os outros ' + fmtK(foraDeTudo) + ' não aparecem em lugar nenhum',

    ['alert-triangle', 'red', 'A DRE de agosto tem utilidades zeradas',

  ].map(a => {
    const tone = { blue: 'bg-blue-50 text-blue-600', amber: 'bg-amber-50 text-amber-600', red: 'bg-red-50 text-red-600' };
    return '<div class="flex gap-3">' +
      '<div class="w-8 h-8 rounded-lg grid place-items-center shrink-0 ' + tone[a[1]] + '"><i data-feather="' + a[0] + '" class="w-4 h-4"></i></div>' +
      '<div class="min-w-0"><h3 class="text-sm font-semibold text-slate-900 leading-snug">' + a[2] + '</h3>' +
      '<p class="text-xs text-slate-600 mt-1 leading-relaxed">' + a[3] + '</p></div></div>';

  $('#est-fonte').innerHTML = 'Fonte: <a href="' + esc(E.fonte) + '" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-medium">' +
    esc(E.titulo_fonte) + '</a>, planilha mantida pela diretoria financeira · dados de ' + esc(E.atualizado) +
    '. As contas pendentes de setembro — água, energia, IPTU e taxa de lixo — também constam do contas a pagar do Campos Hall para outubro. Vale conferir as duas listas antes de pagar, para não pagar duas vezes.';
  icons();
}

/* ============ 9. atualizações ============ */
const ROTINA_MES = [
  ['Reúna os dois arquivos do mês', 'A planilha de fluxo de caixa atualizada e a pasta digital da contabilidade, com balancete, balanço e DRE.'],
  ['Peça a atualização do painel', 'Envie os dois arquivos na conversa e peça o arquivo de dados do mês. A reclassificação gerencial, o balanço, os recebíveis e os textos de análise são refeitos sobre a nova base.'],
  ['Carregue o arquivo de dados', 'Clique em “Carregar” e escolha o campos_hall_dados_AAAA_MM.json. Pipeline, votos e atas continuam exatamente como estavam.'],
  ['Envie a pasta digital para a central', 'Em “Central de documentos”, use “Enviar documento” para registrar a pasta do mês. Se o PDF passar de 4 MB, guarde o link do Drive no campo de link externo.'],
  ['Deixe o controle do estacionamento em dia', 'A planilha do estacionamento é lida direto do link, então basta mantê-la atualizada — a aba Extra contábil · estacionamento é refeita a cada fechamento junto com o resto.']
];
const ROTINA_ATA = [
  ['Registre a ata com o PDF assinado', 'Em “Atas e deliberações”, use “Registrar ata”, liste as deliberações uma por linha e anexe o arquivo.'],
  ['Atualize o andamento das matérias', 'Marque os votos e mude o status de cada matéria para aprovada, rejeitada ou adiada.'],
  ['Salve o arquivo de trabalho', 'Clique em “Salvar” no topo e guarde o arquivo na pasta compartilhada dos sócios. Ele passa a ser a versão corrente do painel.']
];
const SCHEMA = [
  ['dre', 'DRE gerencial e contábil, com o detalhe por conta', 'Aba DRE gerencial e o gráfico da visão geral'],
  ['serie_caixa', 'Série mensal de caixa, um objeto por mês, com a chave AAAA-MM', 'Aba Fluxo de caixa e filtro de período'],
  ['mix', 'Receita por linha de negócio, em regime de caixa', 'Rosca “De onde vem a receita”'],
  ['balanco e caixa_detalhe', 'Balancete e composição das aplicações', 'Aba Balanço e caixa'],
  ['receber e pagar', 'Parcelas contratadas e compromissos do mês', 'Aba Balanço e caixa'],
  ['socios', 'Quadro societário e situação dos aportes', 'Visão geral'],
  ['alertas e recomendacoes', 'Os textos de análise financeira', 'Visão geral e DRE'],
  ['delibs', 'Matérias em pauta para os sócios', 'Aba Atas e deliberações'],
  ['docs', 'Registro base da central de documentos', 'Aba Central de documentos'],
  ['estacionamento', 'Sublocação do estacionamento: devido, quitado e os lançamentos de cada mês', 'Aba Extra contábil · estacionamento'],
  ['meta', 'Competência, fontes e datas mostradas no painel', 'Cabeçalho e rodapé']
];
function renderUpdates() {
  const m = DB.meta;
  $('#up-kpis').innerHTML = [
    kpiCard('Competência dos dados', m.competencia, 'Período de ' + m.periodo),
    kpiCard('Fonte contábil', m.fonte_contabil, 'Balancete, balanço e DRE'),
    kpiCard('Fonte do caixa', m.fonte_caixa, 'Razão do Itaú e provisões'),
    kpiCard('Último carregamento', carregadoEm || 'Dados originais', carregadoEm ? 'Arquivo carregado neste navegador' : 'Nenhum arquivo carregado ainda', carregadoEm ? 'text-emerald-600' : '')
  ].join('');

  const passos = (arr, id) => $('#' + id).innerHTML = arr.map((p, i) =>
    '<li class="flex gap-3">' +
    '<span class="w-6 h-6 rounded-full bg-blue-50 text-blue-700 text-xs font-bold grid place-items-center shrink-0 mt-0.5">' + (i + 1) + '</span>' +
    '<div><h3 class="text-sm font-semibold text-slate-900">' + p[0] + '</h3>' +
    '<p class="text-sm text-slate-600 mt-0.5 leading-relaxed">' + p[1] + '</p></div></li>').join('');
  passos(ROTINA_MES, 'rotina-mes');
  passos(ROTINA_ATA, 'rotina-ata');

  const anexos = [...todasAtas(), ...userDocs].filter(x => x.arq && x.arq.dados);
  const peso = anexos.reduce((t, x) => t + (x.arq.tamanho || 0), 0);
  $('#up-log').innerHTML = '<div class="rounded-lg bg-slate-50 border border-slate-200 p-4 text-xs text-slate-600 space-y-1.5">' +
    '<div class="flex justify-between"><span>Oportunidades no pipeline</span><span class="font-semibold text-slate-900">' + deals.length + '</span></div>' +
    '<div class="flex justify-between"><span>Matérias com voto registrado</span><span class="font-semibold text-slate-900">' + Object.keys(votes).length + ' de ' + DB.delibs.length + '</span></div>' +
    '<div class="flex justify-between"><span>Atas registradas no painel</span><span class="font-semibold text-slate-900">' + userAtas.length + '</span></div>' +
    '<div class="flex justify-between"><span>Documentos enviados no painel</span><span class="font-semibold text-slate-900">' + userDocs.length + '</span></div>' +
    '<div class="flex justify-between border-t border-slate-200 pt-1.5 mt-1.5"><span>Arquivos anexados</span><span class="font-semibold text-slate-900">' + anexos.length + (peso ? ' · ' + (peso / 1048576).toFixed(1).replace('.', ',') + ' MB' : '') + '</span></div></div>';

  $('#t-schema').innerHTML = '<thead><tr><th>Chave do arquivo</th><th>O que traz</th><th>Onde aparece</th></tr></thead><tbody>' +
    SCHEMA.map(r => '<tr><td class="font-medium text-slate-900 whitespace-nowrap">' + r[0] + '</td><td class="text-slate-600">' + r[1] + '</td><td class="text-slate-500">' + r[2] + '</td></tr>').join('') +
    '</tbody>';
  icons();
}

/* ============ salvar e carregar ============ */
function baixar(obj, nome) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function salvar() {
  baixar({ versao: 2, salvo_em: new Date().toISOString(), dados: DB, trabalho: { deals, votes, userAtas, userDocs, pipeUpdated } },
    'campos_hall_painel_' + new Date().toISOString().slice(0, 10) + '.json');
  toast('Arquivo de trabalho baixado', 'download');
}
$('#btn-save').addEventListener('click', salvar);
$('#btn-save2').addEventListener('click', salvar);

const CHAVES_DADOS = ['dre', 'serie_caixa', 'mix', 'balanco', 'receber', 'socios', 'caixa_detalhe', 'pagar', 'alertas', 'recomendacoes', 'delibs', 'docs', 'atas', 'meta', 'deals'];
function aplicar(json) {
  const dados = json.dados || json;
  let trocadas = [];
  CHAVES_DADOS.forEach(k => {
    if (dados[k] !== undefined) {
      if (k === 'deals' && !json.trabalho) return;      // pipeline só é substituído por arquivo de trabalho
      DB[k] = dados[k]; trocadas.push(k);
    }
  });
  if (json.trabalho) {
    const t = json.trabalho;
    if (Array.isArray(t.deals)) deals = t.deals;
    if (t.votes) votes = t.votes;
    if (Array.isArray(t.userAtas)) userAtas = t.userAtas;
    if (Array.isArray(t.userDocs)) userDocs = t.userDocs;
    pipeUpdated = t.pipeUpdated || pipeUpdated;
  }
  if (!trocadas.length && !json.trabalho) { toast('O arquivo não tem dados reconhecidos', 'alert-circle'); return; }
  carregadoEm = hoje() + (dados.meta ? ' · ' + dados.meta.competencia : '');
  renderTudo();
  toast('Prévia local: só na sua tela, até recarregar', 'eye');
  // Isto não grava nada e nenhum sócio vê. Para valer, a mudança passa
  // pelo assistente, que registra proposta e publica versão nova.
}
$('#load-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const ehJson = /\.json$/i.test(f.name) || f.type === 'application/json';
  if (!ehJson) { anexarComoDocumento(f); e.target.value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    try { aplicar(JSON.parse(r.result)); }
    catch (err) { anexarComoDocumento(f, 'Não consegui ler como arquivo de dados do painel'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ============ boot ============ */
function renderTudo() {
  /* Cada seção desenha dentro do seu próprio try. Antes, um campo faltando
     em qualquer lugar jogava o painel inteiro na tela de erro — nove abas
     apagadas por causa de uma. Agora a seção que falha é nomeada e as
     outras continuam de pé. */
  const etapas = [
    ['Visão geral', renderVisao], ['DRE gerencial', renderDre],
    ['Balanço e caixa', renderBalanco], ['Fluxo de caixa', renderFluxo],
    ['Pipeline comercial', renderPipe], ['Atas e deliberações', renderDelibs],
    ['Matérias em votação', renderMaterias], ['Pendências', renderPendencias],
    ['Comentários', renderFeedComentarios],
    ['Atas', renderAtas], ['Central de documentos', renderDocs],
    ['Estacionamento', renderEstacionamento], ['Atualizações', renderUpdates],
    ['Rótulos de período', rotulosPeriodo],
  ];

  const quebrou = [];
  etapas.forEach(([nome, fn]) => {
    try { fn(); }
    catch (e) { quebrou.push(nome); console.error('[painel] falhou ao desenhar "' + nome + '"', e); }
  });

  avisoRender(quebrou);
}

function avisoRender(quebrou) {
  document.getElementById('aviso-render')?.remove();
  if (!quebrou.length) return;

  const d = document.createElement('div');
  d.id = 'aviso-render';
  d.className = 'no-print bg-red-50 border-b border-red-200 px-4 sm:px-8 py-2.5 text-xs text-red-900 leading-relaxed';
  d.innerHTML = '<strong>' + (quebrou.length === 1 ? 'Uma seção não carregou' : quebrou.length + ' seções não carregaram')
    + ':</strong> ' + quebrou.map(esc).join(', ')
    + '. O resto do painel está correto. Avise a diretoria — o detalhe está no console do navegador.';
  document.querySelector('.min-h-screen')?.prepend(d);
}
$$('#modal-deal, #modal-ata, #modal-doc, #modal-period').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDeal(); closeAta(); closeDoc(); closeNav(); fecharPeriodo(); } });
function bootPainel() {
  deals = JSON.parse(JSON.stringify(DB.deals || []));
  renderTudo();
  const hash = location.hash.replace('#', '');
  if (TITLES[hash]) go(hash);
  icons();
}

/* O painel não desenha nada antes de haver sessão e dados: quem chama
   bootPainel() é iniciarPainel(), depois do login. */
iniciarPainel();
</script>
