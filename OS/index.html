<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campos Hall OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Campos Hall OS 2.0 — mesma linguagem do Painel de Governança: Inter, fundo slate-50, cartões brancos de borda fina, azul 600, menu lateral branco. */
:root{
  --navy:#0f172a; --blue:#2563eb; --green:#047857; --rust:#dc2626; --amber:#b45309;
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --fg:#1e293b; --muted:#64748b; --line:#e2e8f0;
  --side:#ffffff; --side-fg:#475569; --side-mut:#94a3b8; --side-act:#f1f5f9; --side-line:#e2e8f0; --on-blue:#ffffff;
  --blue-s:#eff6ff; --green-s:#ecfdf5; --rust-s:#fef2f2; --amber-s:#fffbeb; --grey-s:#f1f5f9; --scrim:rgba(15,23,42,.5);
  --blue-r:#bfdbfe; --green-r:#a7f3d0; --rust-r:#fecaca; --amber-r:#fde68a; --grey-r:#e2e8f0;
  --ink:#0f172a; --ink-fg:#e2e8f0; --ink-mut:#94a3b8; --ink-line:#334155; --ink-act:#1e293b;
  --display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --tap:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#f1f5f9; --blue:#60a5fa; --green:#34d399; --rust:#f87171; --amber:#fbbf24;
  --bg:#0b1220; --surface:#111a2e; --surface2:#17223a; --fg:#e2e8f0; --muted:#94a3b8; --line:#243049;
  --side:#111a2e; --side-fg:#cbd5e1; --side-mut:#7c8aa3; --side-act:#17223a; --side-line:#243049; --on-blue:#0b1220;
  --blue-s:#172554; --green-s:#052e22; --rust-s:#3b1212; --amber-s:#3a2a06; --grey-s:#1e293b; --scrim:rgba(0,0,0,.6);
  --blue-r:#1e3a8a; --green-r:#065f46; --rust-r:#7f1d1d; --amber-r:#78350f; --grey-r:#334155;
  --ink:#060b16; --ink-fg:#e2e8f0; --ink-mut:#94a3b8; --ink-line:#243049; --ink-act:#17223a; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#f1f5f9; --blue:#60a5fa; --green:#34d399; --rust:#f87171; --amber:#fbbf24;
  --bg:#0b1220; --surface:#111a2e; --surface2:#17223a; --fg:#e2e8f0; --muted:#94a3b8; --line:#243049;
  --side:#111a2e; --side-fg:#cbd5e1; --side-mut:#7c8aa3; --side-act:#17223a; --side-line:#243049; --on-blue:#0b1220;
  --blue-s:#172554; --green-s:#052e22; --rust-s:#3b1212; --amber-s:#3a2a06; --grey-s:#1e293b; --scrim:rgba(0,0,0,.6);
  --blue-r:#1e3a8a; --green-r:#065f46; --rust-r:#7f1d1d; --amber-r:#78350f; --grey-r:#334155;
  --ink:#060b16; --ink-fg:#e2e8f0; --ink-mut:#94a3b8; --ink-line:#243049; --ink-act:#17223a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-family:var(--display);font-size:28px;line-height:1.15;margin:0;text-wrap:balance;color:var(--navy)}
h2{font-family:var(--display);font-size:18.5px;margin:0;color:var(--navy);text-wrap:balance}
h3{font-size:13.5px;margin:0;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.lede{color:var(--muted);max-width:68ch}
.sm,small{font-size:12px;color:var(--muted)}
/* casca */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding:16px 10px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{background:none;border:0;text-align:left;padding:4px 8px;color:var(--side-fg)}
.brand b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.brand span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut)}
.side .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mut);padding:6px 10px 2px}
.rolesel{width:100%;background:var(--side-act);color:var(--side-fg);border:1px solid var(--side-line);border-radius:8px;padding:9px 8px;font:inherit;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:7px;color:var(--side-fg);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:var(--side-act)}
.nav button[aria-current="page"]{background:var(--side-act);box-shadow:inset 3px 0 0 #6f95ff}
.nav .n{background:#6f95ff;color:#0a1220;border-radius:99px;font-size:10.5px;font-weight:700;padding:0 6px;align-self:center}
.side .foot{margin-top:auto;font-size:11px;color:var(--side-mut);padding:0 8px}
.col-main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .search{flex:1;min-width:0;position:relative}
.top .search input{width:100%;padding-left:12px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px var(--scrim);max-height:60vh;overflow:auto;z-index:30}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-top:1px solid var(--line)}
.results button:first-child{border-top:0}
.results button:hover{background:var(--surface2)}
.icb{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:36px;padding:0 10px;font-weight:600;font-size:12.5px;white-space:nowrap;position:relative}
.icb .dot{position:absolute;top:-5px;right:-5px;background:var(--rust);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.main{padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bnav{display:none}
/* blocos */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;min-width:0;display:flex;flex-direction:column;gap:10px}
.soft{background:var(--surface2);border-radius:8px;padding:11px 12px}
button.card{text-align:left}
button.card:hover,.click:hover{border-color:var(--blue)}
.kpi .v{font-family:var(--display);font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-g{background:var(--green-s);color:var(--green)} .p-r{background:var(--rust-s);color:var(--rust)}
.p-a{background:var(--amber-s);color:var(--amber)} .p-b{background:var(--blue-s);color:var(--blue)} .p-n{background:var(--grey-s);color:var(--muted)}
.t-g{color:var(--green)} .t-r{color:var(--rust)} .t-a{color:var(--amber)} .t-b{color:var(--blue)} .t-m,.t-n{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.list{display:flex;flex-direction:column}
.list>*{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list>*:first-child{border-top:0}
.list .x{min-width:0;flex:1}
.list b.v{white-space:nowrap;font-variant-numeric:tabular-nums}
button.li:hover{background:var(--surface2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;min-height:36px}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ok{background:var(--green-s);border-color:var(--green);color:var(--green)}
.btn.no{background:var(--rust-s);border-color:var(--rust);color:var(--rust)}
.btn.big{min-height:var(--tap);padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lk{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-align:left}
.lk:hover{text-decoration:underline}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%;min-height:36px}
textarea{min-height:70px;width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select{width:100%}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.banner{background:var(--amber-s);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:500}
.banner.r{background:var(--rust-s);color:var(--rust)} .banner.g{background:var(--green-s);color:var(--green)} .banner.b{background:var(--blue-s);color:var(--blue)}
.bar{height:8px;border-radius:9px;background:var(--grey-s);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;min-height:40px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
/* tabelas que viram cartões no celular */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
@media (max-width:720px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
  table.rt td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rt td::before{content:attr(data-l);color:var(--muted);font-size:11.5px;text-align:left;flex-shrink:0}
  table.rt td:first-child{font-weight:700;text-align:left;display:block}
  table.rt td:first-child::before{content:none}
  table.rt td:empty{display:none}
}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:120px}
.col.over{border-color:var(--blue);background:var(--blue-s)}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;text-align:left;cursor:grab}
.deal:hover{border-color:var(--blue)}
.deal b{font-size:13px}
/* gaveta e modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(680px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:-12px 0 40px var(--scrim)}
.scrim.mid{justify-content:center;align-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:14px;padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
/* mapa */
.mapbox{position:relative;background:var(--surface2);border-radius:8px;border:1px solid var(--line);overflow:hidden;touch-action:none}
.map{width:100%;height:auto;display:block;cursor:grab}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.room rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.room{cursor:pointer}
.room.fit rect{stroke:var(--green);stroke-width:2}
.room.sel rect{fill:var(--blue);stroke:var(--blue)}
.room.sel text{fill:var(--on-blue)}
.room.busy rect{fill:var(--rust-s);stroke:var(--rust);stroke-dasharray:4 3}
.room.hold rect{fill:var(--amber-s);stroke:var(--amber);stroke-dasharray:4 3}
.room.cur rect{stroke-width:3}
.room text{font:600 10px var(--body);fill:var(--fg);pointer-events:none}
.room text.a{font-weight:400;font-size:8.5px;fill:var(--muted)}
.room.sel text.a{fill:var(--on-blue)}
.map .circ{fill:none;stroke:var(--line);stroke-dasharray:3 4}
.map .lbl{font:500 9px var(--body);fill:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* calendários */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-variant-numeric:tabular-nums}
.cal span{font-size:10.5px;text-align:center;color:var(--muted)}
.cal button{border:1px solid transparent;background:var(--surface2);border-radius:6px;padding:0;min-height:38px;font-size:12.5px}
.cal button.hi{box-shadow:inset 0 -3px 0 var(--amber)}
.cal button.in{background:var(--blue-s)}
.cal button.end{background:var(--blue);color:var(--on-blue);font-weight:700}
.cal button.bz{background:var(--rust-s);color:var(--rust);text-decoration:line-through}
.cal button.hd{background:var(--amber-s);color:var(--amber)}
.cal button:disabled{opacity:.35;cursor:default}
.gantt{display:grid;gap:2px;font-size:10.5px;min-width:760px}
.gantt b{font-weight:600;color:var(--muted);align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt i{height:22px;border-radius:3px;background:var(--grey-s);display:block}
.gantt i.conf{background:var(--green)} .gantt i.pre{background:var(--amber)} .gantt i.mont{background:var(--blue)} .gantt i.man{background:var(--rust)} .gantt i.bloq{background:var(--muted)} .gantt i.x{background:none}
.gantt i.cf{outline:2px solid var(--rust);outline-offset:-2px}
.gantt .hd{text-align:center;color:var(--muted)}
.heat{display:grid;grid-template-columns:44px repeat(12,minmax(26px,1fr));gap:3px;font-size:10.5px;min-width:520px}
.heat i{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:600}
/* assistente da calculadora */
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.steps button{border:0;background:var(--grey-s);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap;min-height:34px}
.steps button[aria-current="step"]{background:var(--navy);color:var(--bg)}
.steps button.done{background:var(--green-s);color:var(--green)}
.calc{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px;align-items:start}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
.tot{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:var(--tap)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-s)}
/* listas de conferência */
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:40px}
.chk input{margin-top:2px;width:20px;height:20px;min-height:0;accent-color:var(--green);flex-shrink:0}
.photo{border:1px dashed var(--muted);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);background:var(--surface2)}
.thumb{width:54px;height:54px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-height:40px;font-weight:700;padding:0}
.nps button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.org{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.org .lvl{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.org button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:center}
.org .dark{background:var(--side);color:var(--side-fg);border-color:var(--side)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:11px 15px;border-radius:9px;font-weight:600;width:max-content;max-width:min(440px,calc(100% - 32px));z-index:80;box-shadow:0 8px 24px var(--scrim)}
.demo-bar{background:var(--side-act);color:var(--side-fg);font-size:12px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar button{background:none;border:1px solid var(--side-line);color:var(--side-fg);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;min-height:28px}
/* site público */
.pub{min-height:100%;display:flex;flex-direction:column}
.pnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--side);color:var(--side-fg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pnav b{font-family:var(--display);font-size:19px}
.pnav .lnk{display:flex;gap:14px}
.pnav .lnk button{background:none;border:0;color:var(--side-fg);font-weight:500}
.band{padding-block:44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band>.in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.band.dark{background:var(--side);color:var(--side-fg)}
.band.dark h1,.band.dark h2{color:#fff}

function rota(v,fora){if(fora)return {who:['socio'],need:1,regra:'Fora do orçamento: sócios, qualquer valor'};
  if(v<=P('alc1'))return {who:[],need:0,regra:`Até ${R(P('alc1'))}: executivo da área, dentro da verba`};

  if(v<=P('alc2'))return {who:['pres','fin'],need:2,regra:`De ${R(P('alc1'))} a ${R(P('alc2'))}: Presidente + Diretor Adm.-Financeiro`};

function thumb(file,cb){if(!file)return cb(null);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.onerror=()=>cb(null);im.src=fr.result};fr.onerror=()=>cb(null);fr.readAsDataURL(file)}

function qr(seed){let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;let o='';const n=17;const fin=(x,y)=>(x<5&&y<5)||(x>n-6&&y<5)||(x<5&&y>n-6);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){h=(h*1103515245+12345)>>>0;const on=fin(x,y)?((x%4===0||y%4===0||x===n-1||y===n-1||x===n-5||y===n-5)||((x%(n-5))===2&&(y%(n-5))===2)):(h>>>16)%2;if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" width="92" height="92" role="img" aria-label="QR Code demonstrativo" style="background:#fff;border-radius:6px"><g fill="#0f172a">${o}</g></svg>`}

function bookings(){const o=[];
  GRADE.forEach(g=>o.push({a:g[0],b:g[1],tp:g[2]==='s'?'conf':'pre',n:g[3]+(g[2]==='r'?' (reserva)':''),rooms:g[4]||null}));
  S.events.forEach(e=>{o.push({a:e.a,b:e.b,tp:'conf',n:e.n,rooms:e.rooms,ev:e.id});if(e.mont)o.push({a:addD(e.a,-e.mont),b:addD(e.a,-1),tp:'mont',n:'Montagem · '+e.n,rooms:e.rooms,ev:e.id})});
  S.deals.filter(d=>d.hold&&d.hold>=HOJE&&!d.ev&&d.a&&d.st!=='perd'&&!GRADE.some(g=>g[0]===d.a)).forEach(d=>o.push({a:d.a,b:d.b,tp:'pre',n:'Pré-reserva · '+d.cli+' (vale até '+brc(d.hold)+')',rooms:d.rooms,deal:d.id}));
  S.blocksCal.forEach(b=>o.push({a:b.a,b:b.b,tp:b.tp,n:b.n,rooms:b.rooms,blk:b.id}));return o}
const hits=(b,d,rid)=>d>=b.a&&d<=b.b&&(!rid||!b.rooms||!b.rooms.length||b.rooms.includes(rid));
const busyOn=(d,rid,bk)=>(bk||bookings()).find(b=>hits(b,d,rid));
const season=m=>[5,6,7,8].includes(m)?['Alta temporada',S.preco.alta]:[12,1].includes(m)?['Férias',S.preco.ferias]:['Baixa temporada',1];
function quote(c,descPct){const p=S.preco,ds=c.a&&c.b?days(c.a,c.b):[],sel=c.sel||[];const linhas=[];
  const rate=d=>{let v=0;const s=new Set(sel);if(s.has('pin')&&s.has('mnc')){v+=p.combo;s.delete('pin');s.delete('mnc')}s.forEach(i=>v+=p[i]);const dt=D(d),w=dt.getUTCDay();return v*season(dt.getUTCMonth()+1)[1]*((w===5||w===6)?p.fds:1)};
  const base=sum(ds.map(rate));if(ds.length)linhas.push([`Espaços · ${ds.length} dia${ds.length>1?'s':''} de evento`,base]);
  const md=(c.mont||0)+(c.desm||0),mont=ds.length?md*rate(ds[0])*p.mont:0;if(mont)linhas.push([`Montagem e desmontagem · ${md} dia${md>1?'s':''} a ${p.mont*100}%`,mont]);
  let serv=0;(c.extras||[]).forEach(k=>{const v=S.serv[k][1]*Math.max(ds.length,1);serv+=v;linhas.push([S.serv[k][0],v])});
  const diarias=(c.hosp||0)*(c.noites||0),dM=ds.length>=3?p.multi/100:0,dH=Math.min(p.hmax,Math.floor(diarias/100)*p.hstep)/100;
  if(dM)linhas.push([`Evento de 3 dias ou mais · −${p.multi}%`,-(base+mont)*dM]);
  if(dH)linhas.push([`Hospedagem · ${diarias} diárias nos hotéis parceiros · −${Math.round(dH*100)}%`,-(base+mont)*dH]);
  const tabela=base+mont+serv-(base+mont)*(dM+dH),dc=(descPct||0)/100*tabela;if(dc)linhas.push([`Desconto comercial · −${descPct}%`,-dc]);
  const total=tabela-dc,cap=sum(sel.map(i=>room(i).cap[c.fmt]||0)),bk=bookings(),conf=[];
  ds.forEach(d=>sel.forEach(i=>{const b=busyOn(d,i,bk);if(b&&!conf.includes(b))conf.push(b)}));
  const custo=(base+mont)*p.custo/100+serv*.7;
  return {ds,linhas,tabela,total,sinal:total*P('sinal')/100,cap,conf,diarias,seas:ds.length?season(D(ds[0]).getUTCMonth()+1)[0]:'',area:sum(sel.map(i=>room(i).a)),margem:total?(total-custo)/total*100:0}}

A.room=d=>{if(Date.now()-(U.noClick||0)<350)return;const c=S.calc,i=c.sel.indexOf(d.id);i<0?c.sel.push(d.id):c.sel.splice(i,1);c.cur=d.id;c.sent=null;save();render()};
A.peek=d=>{if(Date.now()-(U.noClick||0)<350)return;S.calc.cur=d.id;save();render()};

// ------------------------------------------------------------ site público
V.site=()=>{const c=S.calc,cur=room(c.cur)||ROOMS[0];
  const plan=ROOMS.filter(r=>!r.sub).map(r=>`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.hh}" rx="2"/>${r.w>90?`<text x="${r.x+r.w/2}" y="${r.y+r.hh/2+3}" text-anchor="middle">${r.n}</text>`:''}`).join('');
  const band=(cls,inner)=>`<section class="band ${cls}"><div class="in">${inner}</div></section>`;
  return band('dark',`<div class="heroP"><div style="display:flex;flex-direction:column;gap:14px"><div class="eyebrow">Campos do Jordão · Vila Capivari</div><h1>O centro de convenções da Serra da Mantiqueira</h1><p>5.678 m² para até 4.700 pessoas, mais de quinze espaços combináveis e a rede hoteleira da cidade integrada à sua proposta. A cerca de 170 km de São Paulo.</p><div class="row"><button class="btn pri big" data-a="go" data-m="calc">Simular meu evento</button><button class="btn big" data-a="kit" style="background:var(--ink-act);border-color:var(--ink-line);color:var(--ink-fg)">Baixar o kit técnico</button></div><small class="sm">Preço estimado na hora · proposta formal em até 48 h</small></div>
    <div class="plan"><svg viewBox="0 0 760 384" style="width:100%;height:auto" role="img" aria-label="Planta esquemática do piso térreo">${plan}</svg><small class="sm">Planta do térreo (esquemática). A fotografia oficial do empreendimento entra aqui quando o material for carregado.</small></div></div>`)
  +band('alt',`<div class="grid g4">${[['5.678 m²','área total'],['4.700','pessoas'],['8 m','de pé-direito no grande salão'],['15+','espaços combináveis']].map(x=>`<div><div class="big">${x[0]}</div><small>${x[1]}</small></div>`).join('')}</div>`)
  +band('',`<div><div class="eyebrow">Diferenciais</div><h2>Feito para congressos que voltam</h2></div><div class="grid g3">${[['Congresso + hospedagem','Bloco de quartos por categoria nos hotéis parceiros, com tarifa de congresso, transfer e early check-in. Quanto mais diárias, menor a locação.'],['Espaços que se combinam','Do grande salão de 1.400 m² às salas de reunião, VIP e apoio no mesmo piso. Os dois auditórios se unem em um de 518 m².'],['Resposta com prazo','Retorno em 24 h, proposta em 48 h e kit técnico para RFP em 72 h.'],['Catering à sua escolha','Fornecedores homologados usando a cozinha industrial da casa, sem exclusividade.'],['Operação com dono','Um coordenador acompanha o evento do contrato ao pós-evento, com checklist por marco.'],['Destino consolidado','Vila Capivari a pé, gastronomia e rede hoteleira completa na baixa e na alta temporada.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sm">${x[1]}</p></div>`).join('')}</div>`)
  +band('alt',`<div class="row sp"><div><div class="eyebrow">Os espaços</div><h2>Explore a planta e toque em uma sala</h2></div><button class="btn pri" data-a="go" data-m="calc">Simular com estas salas</button></div><div class="calc"><div class="grid">${mapa({piso:c.piso,sel:c.sel,cur:c.cur,act:'peek'})}</div><div class="grid">${roomCard(cur)}<div class="card"><h3>Capacidade por configuração</h3>${table([['Sala',r=>r.n],['Área',r=>r.a?r.a+' m²':'—','n'],['Auditório',r=>r.cap.aud||'—','n'],['Banquete',r=>r.cap.ban||'—','n'],['Recepção',r=>r.cap.rec||'—','n']],ROOMS.filter(r=>!r.sub).slice(0,7))}<small>Capacidades da apresentação institucional; a lotação do AVCB prevalece em contrato.</small></div></div></div>`)
  +band('',`<div><div class="eyebrow">Para cada formato</div><h2>Congressos, convenções, feiras e eventos corporativos</h2></div><div class="grid g4">${[['Congressos médicos e científicos','Plenária, salas simultâneas, área de exposição e secretaria.'],['Convenções corporativas','Auditório, salas de apoio e jantar no mesmo endereço.'],['Feiras e exposições','Grande salão e Centro de Exposições no piso inferior.'],['Sociais e esportivos','Recepção para até 3.000 pessoas no Araucária.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="sm">${x[1]}</p></div>`).join('')}</div>
    <div class="grid g2"><div class="card"><h3>Infraestrutura técnica</h3><div class="list">${['Cozinha industrial e copa de apoio','Ambulatório equipado','Acessibilidade em todos os ambientes','Estacionamento conveniado','Internet dedicada e Wi-Fi do evento (sob contratação)'].map(x=>`<div><span class="x">${x}</span></div>`).join('')}</div></div>
    <div class="card"><h3>Hospedagem integrada</h3><p class="sm">Sua proposta sai com o bloco de quartos por categoria, do econômico ao luxo. O congressista escolhe o hotel; as condições são iguais para todos os parceiros.</p><button class="btn" data-a="go" data-m="calc">Ver o efeito no preço</button></div></div>`)
  +band('alt',`<div><div class="eyebrow">Galeria e cases</div><h2>Quem já realizou aqui</h2></div><div class="grid g4">${['Fachada','Araucária montado','Auditórios','Foyer'].map(x=>`<div class="slot">${x}<br>fotografia oficial a inserir</div>`).join('')}</div><div class="grid g4">${[['Sociedade Brasileira de Dermatologia','31º RADESP · novembro de 2026'],['ABHV','Congresso · outubro de 2026'],["L'Étape Brasil",'Edição Campos do Jordão · setembro de 2026'],['SOPATI e Sociedade do Quadril','Congressos contratados para 2027']].map(x=>`<div class="card"><h3>${x[0]}</h3><small>${x[1]}</small></div>`).join('')}</div><small>Eventos reais da agenda. A divulgação como case depende de autorização escrita de cada cliente (política 6.7).</small>`)
  +band('',`<div><div class="eyebrow">Perguntas frequentes</div><h2>Antes de pedir a proposta</h2></div><div>${[['O preço do simulador é definitivo?','É uma estimativa pela tabela ilustrativa. A proposta formal chega em até 48 horas, com as condições do seu evento.'],['Posso trazer meu buffet?','A casa trabalha com fornecedores homologados, e você escolhe entre eles. Fornecedor próprio paga taxa de uso e cumpre os requisitos de documentação e segurança.'],['Como funciona a hospedagem?','Você informa quantos participantes se hospedam; a proposta sai com o bloco por categoria nos hotéis parceiros. As diárias geradas reduzem a locação.'],['Qual a condição de pagamento?','Sinal na assinatura e saldo antes do evento, conforme a política comercial vigente na data do contrato.'],['Como reservo a data?','A pré-reserva vale por sete dias. A data fica garantida com contrato assinado e sinal.']].map(x=>`<details><summary>${x[0]}</summary><p class="sm" style="margin-top:6px">${x[1]}</p></details>`).join('')}</div>`)
  +band('dark',`<div class="row sp"><div><h2>Vamos desenhar o seu evento</h2><p class="sm">Av. Macedo Soares, 499 · Vila Capivari · Campos do Jordão (SP)</p></div><div class="row"><button class="btn pri big" data-a="go" data-m="calc">Simular e pedir proposta</button><button class="btn big" data-a="visita" style="background:var(--ink-act);border-color:var(--ink-line);color:var(--ink-fg)">Agendar visita</button></div></div>`)};
A.kit=()=>openForm('Kit técnico',[{k:'org',l:'Organização',req:1,v:''},{k:'mail',l:'E-mail',t:'email',req:1,v:''}],'kit',null,'Receber o kit');
U;F.kit=v=>{const d={id:uid(),cli:v.org,evt:'Pedido de kit técnico',tipo:'A qualificar',rooms:null,pax:0,val:0,desc:0,st:'lead',orig:'Kit técnico do site',dm:1,acts:[[HOJE,'Baixou o kit técnico: plantas, capacidades por formato, energia, internet, docas e hotéis parceiros']],prop:null,created:HOJE,mail:v.mail};S.deals.unshift(d);task('Responder a '+v.org+' (kit técnico · 24 h)','exec',addD(HOJE,1),['deal',d.id],'alta');auto('Lead do site','Pedido de kit técnico de '+v.org+' virou lead');toast('Kit enviado (demonstração). O pedido entrou no CRM como lead.')};
A.visita=()=>openForm('Agendar visita técnica',[{k:'org',l:'Organização',req:1,v:''},{k:'d',l:'Data preferida',t:'date',v:addD(HOJE,7)},{k:'mail',l:'E-mail',t:'email',req:1,v:''}],'visita',null,'Pedir visita');
F.visita=v=>{const d={id:uid(),cli:v.org,evt:'Visita técnica em '+br(v.d),tipo:'A qualificar',rooms:null,pax:0,val:0,desc:0,st:'vis',orig:'Site',dm:1,acts:[[HOJE,'Pediu visita técnica para '+br(v.d)]],prop:null,created:HOJE,mail:v.mail};S.deals.unshift(d);task('Confirmar visita técnica de '+v.org+' em '+br(v.d),'exec',addD(HOJE,1),['deal',d.id],'alta');toast('Pedido de visita registrado. O Executivo de Contas confirma em até 24 horas.')};

// ------------------------------------------------------------ simulador em sete etapas
const STEPS=['Seu evento','Espaços','Datas','Personalização','Hospedagem','Orçamento','Enviar'];
V.calc=()=>{const c=S.calc,q=quote(c),pub=S.role==='pub',st=c.step;let body='';
  if(st===1)body=`<h2>Como é o seu evento?</h2><div class="grid g4">${['Congresso','Convenção','Feira','Corporativo','Social','Esportivo'].map(t=>`<button class="opt" aria-pressed="${c.tipo===t}" data-a="cset" data-k="tipo" data-v="${t}"><b>${t}</b></button>`).join('')}</div>
    <div class="grid g2"><label class="field">Formato principal<select id="cfmt" data-a="cfmt">${Object.keys(FMT).map(k=>`<option value="${k}" ${c.fmt===k?'selected':''}>${FMT[k]}</option>`).join('')}</select></label>
    <label class="field">Participantes: <b style="color:var(--fg)">${c.pax.toLocaleString('pt-BR')}</b><input id="cpax" type="range" min="20" max="3000" step="10" value="${c.pax}" data-a="cnum" data-k="pax"></label></div>`;
  if(st===2){const fits=ROOMS.filter(r=>r.cap[c.fmt]>=c.pax).map(r=>r.n);body=`<h2>Escolha os espaços</h2><p class="sm">${fits.length?'Comportam sozinhas o seu público em '+FMT[c.fmt].toLowerCase()+': '+fits.join(', ')+'.':'Nenhuma sala comporta sozinha esse público neste formato: combine espaços.'} Toque para selecionar mais de uma.</p>${mapa({piso:c.piso,sel:c.sel,cur:c.cur,ds:q.ds,fit:c.pax,fmt:c.fmt})}${roomCard(room(c.cur))}`}
  if(st===3){const [y,m]=c.ym.split('-').map(Number),first=D(c.ym+'-01'),nd=new Date(Date.UTC(y,m,0)).getUTCDate(),bk=bookings();let cells='';for(let i=0;i<first.getUTCDay();i++)cells+='<span></span>';
    for(let d=1;d<=nd;d++){const s=c.ym+'-'+String(d).padStart(2,'0');const b=c.sel.map(i=>busyOn(s,i,bk)).find(Boolean);const cls=[b?(b.tp==='pre'?'hd':'bz'):'',c.a&&c.b&&s>c.a&&s<c.b?'in':'',s===c.a||s===c.b?'end':'',season(m)[1]>1?'hi':''].join(' ');
      cells+=`<button class="${cls}" data-a="day" data-d="${s}" ${s<=HOJE?'disabled':''} aria-label="${d} de ${MES[m-1]}${b?', '+esc(b.n):''}">${d}</button>`}
    body=`<div class="row sp"><h2>Quando?</h2><div class="row"><button class="btn" data-a="ym" data-n="-1" aria-label="Mês anterior">‹</button><b style="min-width:86px;text-align:center">${MES[m-1]} ${y}</b><button class="btn" data-a="ym" data-n="1" aria-label="Próximo mês">›</button></div></div>
    <div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--rust-s)"></i>Ocupado nas salas escolhidas</span><span><i style="background:var(--amber-s)"></i>Pré-reserva de outro cliente</span><span><i style="background:var(--amber)"></i>Temporada com diária maior</span></div>
    <p class="sm">${c.a?`De ${br(c.a)}${c.b&&c.b!==c.a?' a '+br(c.b):''}`:'Toque no primeiro e no último dia.'} Sexta e sábado têm acréscimo. A disponibilidade segue a agenda da casa, com horizonte de 36 meses.</p>
    <div class="grid g2"><label class="field">Dias de montagem<select id="cmont" data-a="csel" data-k="mont">${[0,1,2,3].map(n=>`<option ${c.mont===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Dias de desmontagem<select id="cdesm" data-a="csel" data-k="desm">${[0,1,2].map(n=>`<option ${c.desm===n?'selected':''}>${n}</option>`).join('')}</select></label></div>`}
  if(st===4)body=`<h2>Personalize</h2><div class="grid g2">${Object.keys(S.serv).map(k=>`<button class="opt" aria-pressed="${c.extras.includes(k)}" data-a="ext" data-k="${k}"><b>${S.serv[k][0]}</b><small>${R(S.serv[k][1])} por ${S.serv[k][2]} · ilustrativo</small></button>`).join('')}</div>
    <div class="card"><h3>Catering</h3><p class="sm">Você escolhe entre os fornecedores homologados, todos com as mesmas condições de uso da cozinha. O valor é contratado direto com o buffet e não entra nesta estimativa.</p><div class="chips">${S.sup.filter(s=>s.cat==='Catering e buffet'&&s.st==='Homologado').map(s=>`<button class="chip" aria-pressed="${c.cater===s.id}" data-a="cset" data-k="cater" data-v="${s.id}">${s.n}</button>`).join('')}<button class="chip" aria-pressed="${!c.cater}" data-a="cset" data-k="cater" data-v="">Decidir depois</button></div><small>Lista em ordem alfabética, sem ranking. Nomes de demonstração.</small></div>`;
  if(st===5)body=`<h2>Hospedagem dos participantes</h2><div class="grid g2"><label class="field">Participantes hospedados: <b style="color:var(--fg)">${c.hosp}</b><input id="chosp" type="range" min="0" max="${Math.max(50,c.pax)}" step="10" value="${Math.min(c.hosp,c.pax)}" data-a="cnum" data-k="hosp"></label>
    <label class="field">Noites<select id="cnoi" data-a="csel" data-k="noites">${[1,2,3,4,5].map(n=>`<option ${c.noites===n?'selected':''}>${n}</option>`).join('')}</select></label></div>
    <div class="grid g3">${['Econômico','Superior','Luxo'].map(k=>{const h=S.hotels.filter(x=>x.cat===k);return `<button class="opt" aria-pressed="${c.hcat===k}" data-a="cset" data-k="hcat" data-v="${k}"><b>${k}</b><small>${h.length} hotel${h.length>1?'s':''} parceiro${h.length>1?'s':''} · tarifa de congresso a partir de ${R(Math.min(...h.map(x=>x.tar)))}</small></button>`}).join('')}</div>
    <div class="banner b">${q.diarias} diárias estimadas. Cada 100 diárias nos hotéis parceiros reduzem ${S.preco.hstep}% da locação, até ${S.preco.hmax}%. O congressista escolhe o hotel; as condições são iguais para todos.</div><small>Tarifas e hotéis de demonstração; percentuais a calibrar com os hotéis.</small>`;
  if(st===6)body=`<h2>Seu orçamento estimado</h2><div class="list">${q.linhas.map(l=>`<div><span class="x">${l[0]}</span><b class="v ${l[1]<0?'t-g':''}">${R(l[1])}</b></div>`).join('')}</div><div class="row sp"><b>Total estimado</b><span class="tot">${R(q.total)}</span></div>
    <p class="sm">Sinal de ${P('sinal')}% na assinatura (${R(q.sinal)}) e saldo até ${P('saldoD')} dias antes do evento, conforme a política comercial na data do contrato. Valores ilustrativos até a validação da tabela.</p>`;
  if(st===7)body=c.sent?`<h2>Pedido recebido</h2><div class="banner g">O Executivo de Contas responde em até 24 horas e a proposta formal chega em até 48 horas.</div><p class="sm">Sua simulação foi guardada com salas, datas, serviços e valor estimado.</p>${pub?`<div class="row"><button class="btn pri" data-a="as" data-r="exec" data-m="crm">Demonstração: ver este lead no CRM</button><button class="btn" data-a="cnew">Nova simulação</button></div>`:`<button class="btn" data-a="go" data-m="crm">Abrir o CRM</button>`}`
    :`<h2>Receba a proposta formal</h2><div class="grid g2"><label class="field">Organização<input id="lorg" value="${esc(c.org||'')}" placeholder="Nome da empresa ou entidade" data-a="ctxt" data-k="org" autocomplete="organization"></label><label class="field">Seu nome<input id="lnome" value="${esc(c.nome||'')}" data-a="ctxt" data-k="nome" autocomplete="name"></label><label class="field">E-mail<input id="lmail" type="email" value="${esc(c.mail||'')}" data-a="ctxt" data-k="mail" autocomplete="email"></label><label class="field">Telefone<input id="ltel" type="tel" value="${esc(c.tel||'')}" data-a="ctxt" data-k="tel" autocomplete="tel"></label></div>
    ${!c.sel.length||!q.ds.length?'<div class="banner">Escolha ao menos uma sala e as datas para pedir a proposta.</div>':''}${blocked(q)?'<div class="banner r">As datas estão ocupadas em parte das salas. Mude as datas ou as salas.</div>':''}${!c.org||!c.mail?'<small>Informe a organização e o e-mail para enviar.</small>':''}
    <div class="row"><button class="btn pri big" data-a="lead" ${!c.sel.length||!q.ds.length||blocked(q)||!c.org||!c.mail?'disabled':''}>Solicitar proposta</button><button class="btn big" data-a="simsave">Salvar simulação</button><button class="btn big" data-a="visita">Agendar visita</button></div>${c.saved?`<small>Simulação salva neste aparelho (${S.sims.length}).</small>`:''}`;
  return head(pub?'Simulador de eventos':'Mesma ferramenta do site, com a tabela vigente',pub?'Monte seu evento e veja o preço':'Simulador de preço',pill('Tabela ilustrativa · pendente de validação','a'))
  +`<div class="steps" role="list">${STEPS.map((s,i)=>`<button class="${i+1<st?'done':''}" ${i+1===st?'aria-current="step"':''} data-a="step" data-n="${i+1}">${i+1} · ${s}</button>`).join('')}</div>
  <div class="calc"><div class="card">${body}<div class="row sp" style="margin-top:6px"><button class="btn" data-a="step" data-n="${st-1}" ${st===1?'disabled':''}>Voltar</button>${st<7?`<button class="btn pri big" data-a="step" data-n="${st+1}">Continuar</button>`:''}</div></div>
   <div class="card sum"><h3>Resumo</h3><div class="chips">${c.sel.map(i=>pill(room(i).n,'b')).join('')||'<small>Nenhuma sala</small>'}</div>
    <small>${c.tipo} · ${c.pax.toLocaleString('pt-BR')} pessoas em ${FMT[c.fmt].toLowerCase()}${c.a?' · '+per(c.a,c.b||c.a):''}${q.seas?' · '+q.seas:''}</small>
    <small>${q.area.toLocaleString('pt-BR')} m² · capacidade das salas neste formato: ${q.cap.toLocaleString('pt-BR')}</small>
    ${q.cap&&c.pax>q.cap?`<div class="banner r">${c.pax} pessoas passam da capacidade das salas escolhidas (${q.cap}). Adicione salas ou mude o formato.</div>`:''}
    ${q.conf.map(b=>`<div class="banner ${b.tp==='pre'?'':'r'}">${b.tp==='pre'?'Há pré-reserva nessas datas; você entra na fila':'Indisponível'}: ${esc(b.n)}, ${brc(b.a)} a ${brc(b.b)}</div>`).join('')}
    <div class="row sp"><span>Total estimado</span><span class="tot">${R(q.total)}</span></div>
    ${!pub?`<div class="soft"><small>Uso interno · margem estimada de ${N(q.margem,0)}% (mínima ${P('margem')}%, parâmetro demo). O cliente nunca vê custos nem margens.</small></div>`:''}</div></div>`};
A.step=d=>{const n=+d.n;if(n<1||n>7)return;S.calc.step=n;save();render();scrollTo(0,0)};
A.cset=d=>{S.calc[d.k]=d.k==='cater'?(+d.v||null):d.v;S.calc.sent=null;save();render()};
A.in_cnum=(d,t)=>{S.calc[d.k]=+t.value};A.ch_csel=(d,t)=>{S.calc[d.k]=+t.value};A.ch_cfmt=(d,t)=>{S.calc.fmt=t.value};A.in_ctxt=(d,t)=>{S.calc[d.k]=t.value};
A.ym=d=>{let [y,m]=S.calc.ym.split('-').map(Number);m+=+d.n;if(m<1){m=12;y--}if(m>12){m=1;y++}if(y*12+m<2026*12+11||y*12+m>2029*12+11)return;S.calc.ym=y+'-'+String(m).padStart(2,'0');save();render()};
A.day=d=>{const c=S.calc;if(!c.a||c.b||d.d<c.a){c.a=d.d;c.b=null}else c.b=d.d;c.sent=null;save();render()};
A.ext=d=>{const s=S.calc.extras,i=s.indexOf(d.k);i<0?s.push(d.k):s.splice(i,1);save();render()};
A.simsave=()=>{const c=S.calc;S.sims.push({d:HOJE,sel:c.sel.slice(),a:c.a,b:c.b,total:quote(c).total});c.saved=1;save();render();toast('Simulação salva.')};
A.cnew=()=>{const k=seed().calc;S.calc=k;save();render()};
A.lead=()=>{const c=S.calc,q=quote(c);const d={id:uid(),cli:c.org,evt:`${c.tipo} · ${per(c.a,c.b||c.a)} · ${c.pax} pessoas`,tipo:c.tipo,rooms:c.sel.slice(),a:c.a,b:c.b||c.a,mont:c.mont,pax:c.pax,val:Math.round(q.tabela),desc:0,st:'lead',orig:'Calculadora do site',dm:1,created:HOJE,contato:c.nome,mail:c.mail,
   sim:{extras:c.extras.slice(),hosp:q.diarias,hcat:c.hcat,cater:c.cater,fmt:c.fmt},acts:[[HOJE,`Simulação pelo site: ${rnames(c.sel)}, ${R(q.total)} estimados, ${q.diarias} diárias de hotel`]],prop:null,hold:addD(HOJE,P('pre'))};
  S.deals.unshift(d);task(`Responder ao lead ${c.org} (prazo de 24 h)`,'exec',addD(HOJE,1),['deal',d.id],'alta');auto('Lead do site',`Simulação de ${c.org} virou lead, pré-reserva de ${P('pre')} dias e tarefa do Executivo de Contas`);
  c.sent=d.id;save();render();toast('Pedido enviado. O lead entrou no CRM com salas, datas e valor, e a data ficou pré-reservada por '+P('pre')+' dias.')};

// ============================================================ comercial: CRM, propostas, contratos, calendário, revenue, hospedagem, marketing
const canSell=()=>is('exec','com');
const dval=d=>d.val*(1-((d.prop&&d.prop.desc)||0)/100);
const openDeals=()=>S.deals.filter(d=>!['oper','perd','cass','sinal'].includes(d.st));
const PROB={lead:.1,cont:.15,qual:.25,vis:.35,elab:.4,prop:.5,neg:.6,aprv:.65,cenv:.85,cass:1,sinal:1,oper:1,perd:0};
function sla(d){if(d.st==='lead')return ['retorno em 24 h','r'];if(['cont','qual','vis','elab'].includes(d.st))return ['proposta em 48 h','a'];if(d.st==='aprv')return ['aguarda alçada','a'];if(d.st==='cenv')return ['contrato em 7 dias','a'];if(d.st==='neg'||d.st==='prop')return ['acompanhar','b'];return null}
function dealCard(d){const s=sla(d);return `<button class="deal" draggable="${canSell()}" data-did="${d.id}" ${op('deal',d.id)}><b>${esc(d.cli)}</b><span>${esc(d.evt)}</span><span class="row sp"><b>${d.val?R(dval(d)):'valor a informar'}</b><small>${d.orig}</small></span><span class="row">${s?pill(s[0],s[1]):''}${d.dm?pill('demo'):''}${d.hold&&d.hold>=HOJE&&!d.ev?pill('pré-reserva até '+brc(d.hold),'a'):''}</span>${d.obs?`<small class="t-r">${d.obs}</small>`:''}</button>`}
V.crm=()=>{const tb=tabs('crm',[['painel','Painel'],['pipe','Pipeline'],['lista','Oportunidades'],['cli','Clientes'],['prop','Propostas e contratos'],['fc','Forecast e perdas']]);const od=openDeals();let b='';
  if(tb.cur==='painel'){const won=S.deals.filter(d=>['cass','sinal','oper'].includes(d.st)&&d.a>='2027');
    b=`<div class="grid g4">${kp('Funil aberto',Rk(sum(od.map(dval))),od.length+' oportunidades','',goM('crm','pipe'))}${kp('Ponderado pela etapa',Rk(sum(od.map(d=>dval(d)*PROB[d.st]))),'probabilidade por etapa')}${kp('Contratado para 2027',Rk(sum(won.map(dval))),'meta: metade do ano até dezembro','a',goM('crm','fc'))}${kp('Leads sem retorno',S.deals.filter(d=>d.st==='lead').length,'prazo de 24 h','r',goM('crm','pipe'))}</div>
    <div class="grid g2"><div class="card"><h2>Prazos que vencem</h2><div class="list">${od.filter(d=>sla(d)).slice(0,6).map(d=>`<button class="li" ${op('deal',d.id)}><span class="x"><b>${esc(d.cli)}</b><br><small>${stg(d.st)}</small></span>${pill(sla(d)[0],sla(d)[1])}</button>`).join('')}</div></div>
    <div class="card"><h2>Por canal</h2>${table([['Canal',r=>r[0]],['Oportunidades',r=>r[1],'n'],['Valor',r=>Rk(r[2]),'n']],Object.entries(S.deals.reduce((o,d)=>{(o[d.orig]=o[d.orig]||[0,0]);o[d.orig][0]++;o[d.orig][1]+=dval(d);return o},{})).map(e=>[e[0],e[1][0],e[1][1]]).sort((a,b)=>b[2]-a[2]))}</div></div>
    <p class="note">As reservas da grade entram sem valor porque nenhum arquivo informa quanto valem. Itens com a etiqueta demo são exemplos.</p>`}
  if(tb.cur==='pipe')b=`<div class="row sp"><small>${canSell()?'Arraste um cartão para mudar de etapa, ou abra para ver as ações.':'Somente leitura neste perfil.'}</small>${canSell()?'<button class="btn pri" data-a="dnew">Novo lead</button>':''}</div><div class="kan">${STG.map(s=>{const ds=S.deals.filter(d=>d.st===s[0]);return `<div class="col" data-st="${s[0]}"><div class="row sp"><h3>${s[1]}</h3><small>${ds.length}</small></div>${ds.map(dealCard).join('')||'<small>vazio</small>'}</div>`}).join('')}</div>`;
  if(tb.cur==='lista')b=`<div class="row sp">${qbox('deals','Filtrar por cliente ou evento')}${canSell()?'<button class="btn pri" data-a="dnew">Novo lead</button>':''}</div>`+table([['Cliente',d=>esc(d.cli)+dm(d)],['Evento',d=>esc(d.evt)],['Etapa',d=>stg(d.st)],['Canal',d=>d.orig],['Valor',d=>d.val?R(dval(d)):'a informar','n']],qf('deals',S.deals,d=>d.cli+d.evt+stg(d.st)),{k:'deal'});
  if(tb.cur==='cli'){const cl=Object.values(S.deals.reduce((o,d)=>{const c=o[d.cli]=o[d.cli]||{id:d.id,n:d.cli,k:0,v:0,dm:d.dm,last:''};c.k++;c.v+=['cass','sinal','oper'].includes(d.st)?dval(d):0;return o},{}));
    b=qbox('cli','Filtrar clientes')+table([['Empresa',c=>esc(c.n)+dm(c)],['Oportunidades',c=>c.k,'n'],['Contratado',c=>c.v?R(c.v):'—','n']],qf('cli',cl,c=>c.n),{k:'deal'})+`<p class="note">O perfil da empresa reúne contatos, histórico e eventos. Clientes, agenda e CRM são do Campos Hall, com acesso por cargo.</p>`}
  if(tb.cur==='prop')b=table([['Cliente',d=>esc(d.cli)+dm(d)],['Versão',d=>d.prop?'v'+d.prop.ver:'—'],['Desconto',d=>d.prop?d.prop.desc+'%':'—','n'],['Situação',d=>d.prop?pill(d.prop.st,d.prop.st==='aprovada'||d.prop.st==='enviada'?'g':d.prop.st.includes('aguarda')?'a':'n'):pill(stg(d.st))],['Contrato',d=>d.st==='cenv'?pill('enviado, aguardando assinatura','a'):['cass','sinal','oper'].includes(d.st)?pill('assinado','g'):'—'],['Valor',d=>d.val?R(dval(d)):'—','n']],S.deals.filter(d=>d.prop||['cenv','cass','sinal','oper'].includes(d.st)),{k:'deal'})+`<p class="note">Sinal de ${P('sinal')}% e saldo até D-${P('saldoD')}: política ${pst('sinal')}. A assinatura aqui é simulada; a definitiva usará assinatura eletrônica com validade jurídica.</p>`;
  if(tb.cur==='fc'){const yrs=['2026','2027','2028','2029'];const lost=S.deals.filter(d=>d.st==='perd');
    b=`<div class="card"><h2>Forecast de 36 meses</h2>${table([['Ano',y=>y],['Contratado',y=>R(sum(S.deals.filter(d=>['cass','sinal','oper'].includes(d.st)&&(d.a||'').startsWith(y)).map(dval))),'n'],['Funil ponderado',y=>R(sum(od.filter(d=>(d.a||'').startsWith(y)).map(d=>dval(d)*PROB[d.st]))),'n'],['Dias com contrato',y=>sum(bookings().filter(b=>b.tp==='conf'&&b.a.startsWith(y)).map(b=>diff(b.a,b.b)+1)),'n']],yrs)}<small>Receita real de 2026 no módulo financeiro. Para 2028 e 2029 ainda não há contratos: o calendário-âncora de congressos recorrentes é a prioridade.</small></div>
    <div class="grid g2"><div class="card"><h2>Perdas</h2>${lost.length?`<div class="list">${lost.map(d=>`<button class="li" ${op('deal',d.id)}><span class="x"><b>${esc(d.cli)}</b>${dm(d)}<br><small>${esc(d.lost||'motivo não informado')}</small></span><b class="v">${R(d.val)}</b></button>`).join('')}</div>`:'<p class="sm">Nenhuma perda registrada.</p>'}</div>
    <div class="card"><h2>Desempenho da equipe</h2><div class="list"><div><span class="x">Tempo médio até o primeiro retorno</span>${pill('a medir · meta 24 h')}</div><div><span class="x">Tempo médio até a proposta</span>${pill('a medir · meta 48 h')}</div><div><span class="x">Descontos dentro da alçada</span><b>${S.deals.filter(d=>d.prop).length?'100%':'—'}</b></div><div><span class="x">Oportunidades com registro no CRM</span><b>100%</b></div></div><small>Os tempos passam a ser medidos a partir do primeiro lead atendido no sistema.</small></div></div>`}
  return head('Toda interação registrada no dia','CRM e propostas',pill('Funil: '+Rk(sum(od.map(dval))),'b'))+tb.html+b};
DR.deal=id=>{const d=by('deals',id);if(!d)return null;const p=d.prop,s=sla(d),cs=canSell();const lim=P('descExec'),lim2=P('descDir');
  const quem=!p?'':p.desc<=lim?['Dentro da alçada do Executivo de Contas','g']:p.desc<=lim2?['Precisa do Diretor Comercial','a']:['Só a diretoria aprova','r'];
  const marg=p?(1-(S.preco.custo/100)/(1-p.desc/100))*100:0;
  let acts='';if(cs){
    if(d.st==='lead')acts=`<button class="btn pri" data-a="dstage" data-id="${d.id}" data-to="cont">Registrar primeiro contato</button>`;
    if(d.st==='cont')acts=`<button class="btn pri" data-a="dstage" data-id="${d.id}" data-to="qual">Qualificar</button>`;
    if(d.st==='qual')acts=`<button class="btn" data-a="dvis" data-id="${d.id}">Agendar visita técnica</button><button class="btn pri" data-a="pnew" data-id="${d.id}">Elaborar proposta</button>`;
    if(d.st==='vis')acts=`<button class="btn pri" data-a="pnew" data-id="${d.id}">Elaborar proposta</button>`;
    if(d.st==='prop'||d.st==='neg')acts=`${d.st==='prop'?`<button class="btn" data-a="dstage" data-id="${d.id}" data-to="neg">Cliente pediu ajuste</button>`:`<button class="btn" data-a="pver" data-id="${d.id}">Nova versão da proposta</button>`}<button class="btn pri" data-a="cenv" data-id="${d.id}">Cliente aceitou: enviar contrato</button>`;
    if(d.st==='cenv')acts=`<button class="btn pri" data-a="csign" data-id="${d.id}">Simular assinatura do contrato</button>`;
    if(d.st==='cass')acts=`<button class="btn pri" data-a="csinal" data-id="${d.id}">Registrar sinal recebido</button>`;
    if(d.st==='sinal')acts=`<button class="btn pri" data-a="coper" data-id="${d.id}">Entregar à operação</button>`;
    if(!['oper','perd'].includes(d.st))acts+=`<button class="btn" data-a="dact" data-id="${d.id}">Registrar atividade</button><button class="btn no" data-a="dlost" data-id="${d.id}">Marcar como perdido</button>`}
  return {t:esc(d.cli),b:`<div class="card"><div class="row sp"><div><b>${esc(d.evt)}</b>${dm(d)}<br><small>${d.tipo} · canal: ${d.orig}${d.contato?' · contato: '+esc(d.contato):''}</small></div><div style="text-align:right"><div class="tot">${d.val?R(dval(d)):'—'}</div>${pill(stg(d.st),'b')} ${s?pill(s[0],s[1]):''}</div></div>
   ${d.obs?`<div class="banner r">${d.obs}</div>`:''}${d.lost?`<div class="banner">Motivo da perda: ${esc(d.lost)}</div>`:''}
   <div class="list"><div><span class="x">Espaços</span><b>${rnames(d.rooms)}</b></div><div><span class="x">Datas</span><b>${d.a?per(d.a,d.b):'a definir'}</b></div>${d.pax?`<div><span class="x">Público</span><b>${d.pax}</b></div>`:''}${d.hold&&!d.ev?`<div><span class="x">Pré-reserva</span><b>vale até ${br(d.hold)}</b></div>`:''}${d.ev?`<div><span class="x">Evento</span><button class="lk" ${op('evento',d.ev)}>abrir o evento</button></div>`:''}</div>
   ${acts?`<div class="row">${acts}</div>`:''}</div>
  ${p?`<div class="card"><div class="row sp"><h3>Proposta v${p.ver}</h3>${pill(p.st,p.st==='aprovada'||p.st==='enviada'?'g':p.st.includes('aguarda')?'a':'n')}</div>
   ${cs&&['rascunho','enviada','recusada'].includes(p.st)&&['elab','neg','qual','vis'].includes(d.st)?`<div class="grid g2"><label class="field">Valor de tabela (R$)<input id="pv${d.id}" type="number" value="${d.val}" data-a="pval" data-id="${d.id}"></label><label class="field">Desconto: <b style="color:var(--fg)">${p.desc}%</b><input id="pd${d.id}" type="range" min="0" max="40" value="${p.desc}" data-a="pdesc" data-id="${d.id}"></label></div>
   <div class="row sp"><span>${pill(quem[0],quem[1])} ${marg<P('margem')?pill('margem estimada '+N(marg,0)+'% abaixo da mínima','r'):pill('margem estimada '+N(marg,0)+'%','n')}</span><button class="btn pri" data-a="psend" data-id="${d.id}">${p.desc<=lim||(is('com')&&p.desc<=lim2)?'Enviar proposta':'Pedir aprovação'}</button></div>`:''}
   <div class="soft"><b>Como o cliente vê</b><div class="list"><div><span class="x">Locação e serviços</span><b class="v">${R(d.val)}</b></div>${p.desc?`<div><span class="x">Condição comercial · −${p.desc}%</span><b class="v t-g">${R(-d.val*p.desc/100)}</b></div>`:''}<div><span class="x">Total</span><b class="v">${R(dval(d))}</b></div><div><span class="x">Sinal de ${P('sinal')}% na assinatura</span><b class="v">${R(dval(d)*P('sinal')/100)}</b></div><div><span class="x">Bloco de hospedagem anexo</span><b>${p.hosp||0} diárias</b></div></div></div>
   <div class="row"><button class="btn" data-a="ppdf" data-id="${d.id}">Gerar PDF demonstrativo</button>${['cass','sinal','oper'].includes(d.st)&&cs?`<button class="btn" data-a="adit" data-id="${d.id}">Registrar aditivo</button>`:''}</div>
   <div class="tl">${p.hist.map(h=>`<div>${esc(h[1])}<br><small>${br(h[0])}</small></div>`).join('')}</div></div>`:''}
  <div class="card"><h3>Histórico de relacionamento</h3>${d.acts.length?`<div class="tl">${d.acts.slice().reverse().map(a=>`<div>${esc(a[1])}<br><small>${br(a[0])}</small></div>`).join('')}</div>`:'<p class="sm">Sem atividades registradas. Toda interação entra aqui no mesmo dia.</p>'}</div>`}};
const dact=(d,t)=>d.acts.push([HOJE,t]);
function dmove(d,to){if(d.st===to)return;d.st=to;d.since=HOJE;dact(d,'Etapa: '+stg(to));log('Moveu '+d.cli+' para '+stg(to))}
A.dstage=d=>{const x=by('deals',d.id);if(d.to==='perd')return A.dlost(d);dmove(x,d.to);S.tasks.filter(t=>t.ent&&t.ent[0]==='deal'&&t.ent[1]===x.id&&t.role==='exec'&&t.st!=='ok'&&d.to==='cont').forEach(t=>t.st='ok');save();render();toast('Etapa registrada: '+stg(d.to)+'.')};
A.dnew=()=>openForm('Novo lead',[{k:'cli',l:'Empresa ou entidade',req:1},{k:'evt',l:'Evento',req:1},{k:'tipo',l:'Tipo',t:'select',o:['Congresso','Convenção','Feira','Corporativo','Social'],v:'Congresso'},{k:'orig',l:'Canal',t:'select',o:['Indicação','Site','Hotel parceiro','Agência','Prospecção','RFP'],v:'Indicação'},{k:'val',l:'Valor estimado (R$)',t:'number',v:0}],'dnew',null,'Criar lead');
F.dnew=v=>{const d={id:uid(),cli:v.cli,evt:v.evt,tipo:v.tipo,rooms:null,pax:0,val:v.val,desc:0,st:'lead',orig:v.orig,dm:1,acts:[[HOJE,'Lead criado por '+rn(me())]],prop:null,created:HOJE};S.deals.unshift(d);task('Responder ao lead '+v.cli+(v.orig==='RFP'?' (RFP: kit técnico em 72 h)':' (24 h)'),'exec',addD(HOJE,v.orig==='RFP'?3:1),['deal',d.id],'alta');U.drawer={k:'deal',id:d.id};toast('Lead criado com tarefa e prazo.')};
A.dact=d=>openForm('Registrar atividade',[{k:'tp',l:'Tipo',t:'select',o:['Ligação','E-mail','Reunião','Visita','Mensagem'],v:'Ligação'},{k:'t',l:'O que aconteceu',t:'area',req:1}],'dact',+d.id);
F.dact=(v,id)=>{dact(by('deals',id),v.tp+': '+v.t);toast('Atividade registrada.')};
A.dvis=d=>openForm('Agendar visita técnica',[{k:'d',l:'Data',t:'date',v:addD(HOJE,5)}],'dvis',+d.id,'Agendar');
F.dvis=(v,id)=>{const x=by('deals',id);dmove(x,'vis');dact(x,'Visita técnica agendada para '+br(v.d));task('Visita técnica com '+x.cli,'exec',v.d,['deal',id]);toast('Visita agendada e tarefa criada.')};
A.dlost=d=>openForm('Marcar como perdido',[{k:'m',l:'Motivo',t:'select',o:['Preço','Data indisponível','Escolheu outro destino','Evento cancelado','Sem retorno'],v:'Preço'},{k:'t',l:'Detalhe',t:'area'}],'dlost',+d.id,'Registrar perda');
F.dlost=(v,id)=>{const x=by('deals',id);x.lost=v.m+(v.t?': '+v.t:'');x.hold=null;dmove(x,'perd');toast('Perda registrada com motivo. A pré-reserva foi liberada.')};
A.pnew=d=>{const x=by('deals',d.id);if(!x.val)x.val=120000;x.prop={ver:1,desc:0,st:'rascunho',hosp:(x.sim&&x.sim.hosp)||0,hist:[[HOJE,'v1 criada a partir da simulação']]};dmove(x,'elab');if(!x.hold)x.hold=addD(HOJE,P('pre'));save();render()};
A.pver=d=>{const x=by('deals',d.id);x.prop.ver++;x.prop.st='rascunho';x.prop.hist.push([HOJE,'v'+x.prop.ver+' aberta para ajuste']);x.st='neg';save();render()};
A.in_pdesc=(d,t)=>{by('deals',d.id).prop.desc=+t.value};A.in_pval=(d,t)=>{by('deals',d.id).val=+t.value||0};
A.psend=d=>{const x=by('deals',d.id),p=x.prop,dc=p.desc;p.hist.push([HOJE,`v${p.ver} · desconto de ${dc}% · ${R(dval(x))}`]);
  if(dc<=P('descExec')||(is('com')&&dc<=P('descDir'))){p.st='enviada';dmove(x,'prop');toast('Proposta enviada dentro da alçada.')}
  else{const dir=dc<=P('descDir');p.st='aguarda aprovação';dmove(x,'aprv');newAprov({t:`Desconto de ${dc}% · ${x.cli}`,d:x.evt,v:0,who:dir?['com']:['pres','vice','fin'],need:dir?1:2,regra:dir?`Desconto acima de ${P('descExec')}% até ${P('descDir')}%: Diretor Comercial`:`Desconto acima de ${P('descDir')}%: só a diretoria`,kind:'desc',ref:x.id,dm:x.dm});toast(`Desconto de ${dc}% passa da sua alçada: foi para ${dir?'o Diretor Comercial':'a diretoria'}.`)}
  save();render()};
HOOK.desc=a=>{const x=by('deals',a.ref);if(!x||!x.prop)return;if(a.st==='ok'){x.prop.st='aprovada';x.prop.hist.push([HOJE,'Desconto aprovado por '+a.ok.map(rn).join(' e ')]);dmove(x,'prop');task('Enviar ao cliente a proposta aprovada de '+x.cli,'exec',addD(HOJE,1),['deal',x.id],'alta')}else{x.prop.st='recusada';x.prop.hist.push([HOJE,'Desconto recusado']);dmove(x,'neg');task('Renegociar com '+x.cli+': desconto recusado','exec',addD(HOJE,1),['deal',x.id])}};
A.ppdf=d=>{U.drawer={k:'pdf',id:+d.id};render()};
DR.pdf=id=>{const d=by('deals',id);return {t:'Proposta em PDF (demonstrativo)',b:`<div class="card" style="background:#fff;color:#1e293b"><div style="border-bottom:3px solid #0f172a;padding-bottom:8px"><b style="font-family:var(--display);font-size:20px">Campos Hall</b><br><span style="font-size:12px">Proposta comercial v${d.prop?d.prop.ver:1} · ${br(HOJE)}</span></div><p><b>${esc(d.cli)}</b><br>${esc(d.evt)}</p><p>Espaços: ${rnames(d.rooms)}<br>Datas: ${d.a?per(d.a,d.b):'a definir'}</p><p>Total: <b>${R(dval(d))}</b><br>Sinal de ${P('sinal')}% na assinatura; saldo até ${P('saldoD')} dias antes do evento.</p><p style="font-size:12px">Lotação máxima conforme o AVCB. Catering entre os fornecedores homologados. Bloco de hospedagem anexo. Documento de demonstração, sem valor contratual.</p></div><button class="btn" ${op('deal',id)}>Voltar à oportunidade</button>`}};
A.cenv=d=>{const x=by('deals',d.id);dmove(x,'cenv');dact(x,'Contrato-padrão enviado; meta de assinatura em 7 dias');task('Acompanhar assinatura do contrato de '+x.cli,'exec',addD(HOJE,7),['deal',x.id]);save();render();toast('Contrato-padrão enviado. Meta: assinatura em 7 dias.')};
A.adit=d=>openForm('Registrar aditivo',[{k:'t',l:'Objeto do aditivo',req:1,v:'Um dia a mais de locação'},{k:'v',l:'Valor (R$)',t:'number',v:20000}],'adit',+d.id);
F.adit=(v,id)=>{const x=by('deals',id);x.val+=v.v;dact(x,'Aditivo: '+v.t+' · '+R(v.v));const e=by('events',x.ev);if(e)e.rec.contr+=v.v;toast('Aditivo registrado no contrato e no resultado do evento.')};
function eventFromDeal(x){const id=uid(),e=mkEvent({id,n:x.evt.split(' · ')[0]+' · '+x.cli,cli:x.cli,dm:x.dm,a:x.a||addD(HOJE,120),b:x.b||x.a||addD(HOJE,121),mont:x.mont==null?1:x.mont,rooms:x.rooms,pax:x.pax||0,deal:x.id,done:{'0_3':1},cater:x.sim&&x.sim.cater||null,rec:{contr:dval(x),fat:dval(x)*P('sinal')/100,rec:0}});
  S.events.push(e);x.ev=id;x.hold=null;MARCOS.forEach((m,i)=>{const due=m[1]==null?addD(HOJE,2):addD(m[1]>0?e.b:e.a,m[1]);task(`${m[0]} · ${e.n}: ${m[3].length} itens do checklist`,m[2],due<HOJE?HOJE:due,['evento',id],i===0?'alta':'média')});return e}
A.csign=d=>{const x=by('deals',d.id);const e=eventFromDeal(x);dmove(x,'cass');dact(x,'Contrato assinado (assinatura simulada)');const v=dval(x)*P('sinal')/100;
  S.receber.unshift({id:uid(),n:'Sinal · '+x.cli,venc:addD(HOJE,3),v,obs:'gerado pelo contrato',st:'aberto',deal:x.id,dm:1});task('Faturar e cobrar o sinal de '+x.cli+' · '+R(v),'adm',addD(HOJE,1),['deal',x.id],'alta');
  auto('Contrato assinado',`${x.cli}: evento criado, agenda bloqueada, sinal de ${R(v)} a receber, seis marcos de checklist e briefing ao coordenador`);save();U.drawer={k:'evento',id:e.id};render();toast('Contrato assinado: evento criado, agenda bloqueada, sinal na fila do financeiro e tarefas por marco geradas.')};
A.csinal=d=>{const x=by('deals',d.id);dmove(x,'sinal');const r=S.receber.find(r=>r.deal===x.id);if(r){r.st='recebido'}const e=by('events',x.ev);if(e){e.rec.rec+=dval(x)*P('sinal')/100;e.done['0_2']=1}save();render();toast('Sinal registrado: contas a receber e resultado do evento atualizados.')};
A.coper=d=>{const x=by('deals',d.id);dmove(x,'oper');const e=by('events',x.ev);if(e)e.done['0_0']=1;task('Briefing recebido: abrir o planejamento de '+x.cli,'coord',addD(HOJE,1),['evento',x.ev],'alta');save();render();toast('Briefing entregue ao Coordenador de Eventos.')};
let dragD=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.deal');if(c){dragD=c.dataset.did;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragD){e.preventDefault();c.classList.add('over')}});

// ------------------------------------------------------------ calendário central
const TP={conf:'Confirmado',pre:'Pré-reserva',mont:'Montagem e desmontagem',man:'Manutenção',bloq:'Bloqueio'};
const CALROOMS=['ara','pin','mnc','ipe','can','ery','jgi','lob','hal','lan','exp'];
function occ(y,m,bk){const nd=new Date(Date.UTC(y,m,0)).getUTCDate();let n=0;for(let d=1;d<=nd;d++){const s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(bk.some(b=>(b.tp==='conf'||b.tp==='pre')&&s>=b.a&&s<=b.b))n++}return [n,nd]}
V.cal=()=>{const tb=tabs('cal',[['mes','Por ambiente'],['sem','Semana'],['ano','Ocupação e sazonalidade'],['lista','Lista']]);const bk=bookings();const ym=U.calYm||'2026-11';const [y,m]=ym.split('-').map(Number);let b='';
  const nav=`<div class="row"><button class="btn" data-a="calym" data-n="-1" aria-label="Mês anterior">‹</button><b style="min-width:90px;text-align:center">${MES[m-1]} ${y}</b><button class="btn" data-a="calym" data-n="1" aria-label="Próximo mês">›</button><button class="btn" data-a="calym" data-n="0">Hoje</button></div>`;
  const add=is('com','exec','ger','coord')?'<button class="btn pri" data-a="blk">Nova pré-reserva ou bloqueio</button>':'';
  if(tb.cur==='mes'||tb.cur==='sem'){const nd=new Date(Date.UTC(y,m,0)).getUTCDate();const first=tb.cur==='sem'?(ym===HOJE.slice(0,7)?+HOJE.slice(8):1):1,last=tb.cur==='sem'?Math.min(nd,first+6):nd;const dd=[];for(let d=first;d<=last;d++)dd.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);const conflicts=[];
    let g=`<b></b>`+dd.map(s=>`<span class="hd">${+s.slice(8)}</span>`).join('');
    CALROOMS.forEach(rid=>{g+=`<b>${room(rid).n}</b>`;dd.forEach(s=>{const hs=bk.filter(b=>hits(b,s,rid));const main=hs.find(h=>h.tp==='conf')||hs[0];const cf=hs.filter(h=>h.tp!=='pre').length>1;if(cf)conflicts.push([s,rid,hs]);
      g+=main?`<i class="${main.tp}${cf?' cf':''}" title="${esc(hs.map(h=>h.n).join(' + '))}" ${main.ev?op('evento',main.ev):main.deal?op('deal',main.deal):''} ${main.ev||main.deal?'style="cursor:pointer"':''}></i>`:'<i></i>'})});
    const list=bk.filter(b=>b.b>=dd[0]&&b.a<=dd[dd.length-1]);
    b=`<div class="row sp">${nav}${add}</div><div class="card"><div class="tbl"><div class="gantt" style="grid-template-columns:${tb.cur==='sem'?'120px repeat('+dd.length+',1fr);min-width:0':'110px repeat('+dd.length+',minmax(15px,1fr))'}">${g}</div></div><div class="legend">${Object.keys(TP).map(k=>`<span><i style="background:${{conf:'var(--green)',pre:'var(--amber)',mont:'var(--blue)',man:'var(--rust)',bloq:'var(--muted)'}[k]}"></i>${TP[k]}</span>`).join('')}<span><i style="outline:2px solid var(--rust)"></i>Conflito</span></div></div>
    ${conflicts.length?`<div class="banner r">${conflicts.length} conflito(s) no período: ${[...new Set(conflicts.map(c=>brc(c[0])+' · '+room(c[1]).n+' ('+c[2].map(h=>h.n).join(' × ')+')'))].slice(0,3).join('; ')}</div>`:''}
    <div class="card"><h3>No período</h3>${list.length?`<div class="list">${list.map(x=>`<${x.ev||x.deal?`button class="li" ${x.ev?op('evento',x.ev):op('deal',x.deal)}`:'div'}><span class="x"><b>${esc(x.n)}</b><br><small>${per(x.a,x.b)} · ${rnames(x.rooms)}</small></span>${pill(TP[x.tp],{conf:'g',pre:'a',mont:'b',man:'r',bloq:'n'}[x.tp])}${x.blk&&add?`<button class="btn" data-a="blkdel" data-id="${x.blk}">Liberar</button>`:''}</${x.ev||x.deal?'button':'div'}>`).join('')}</div>`:'<p class="sm">Nenhuma ocupação neste período: datas livres para oferecer.</p>'}</div>`}
  if(tb.cur==='ano'){const ys=[2026,2027,2028,2029];const col=p=>p>=.6?'var(--green)':p>=.3?'var(--amber)':p>0?'var(--blue-s)':'var(--grey-s)';
    b=`<div class="card"><h2>Ocupação por mês, horizonte de 36 meses</h2><div class="tbl"><div class="heat"><b></b>${MES.map(x=>`<span style="text-align:center;color:var(--muted)">${x}</span>`).join('')}${ys.map(yy=>`<b>${yy}</b>`+MES.map((_,i)=>{const o=occ(yy,i+1,bk),p=o[0]/o[1];return `<i style="background:${col(p)};color:${p>=.3?'#fff':'var(--muted)'};cursor:pointer" data-a="calgo" data-ym="${yy}-${String(i+1).padStart(2,'0')}" title="${o[0]} de ${o[1]} dias">${o[0]||''}</i>`}).join('')).join('')}</div></div><div class="legend"><span>Número = dias com evento confirmado ou reserva</span><span><i style="background:var(--green)"></i>60% ou mais</span><span><i style="background:var(--amber)"></i>30% a 59%</span><span><i style="background:var(--blue-s)"></i>até 29%</span></div>
    <p class="note">Maio a agosto concentram 65% da receita de 2026. De setembro a abril há meses inteiros sem evento em 2027, e 2028 e 2029 ainda estão vazios: toque em um mês para abrir a agenda.</p></div>`}
  if(tb.cur==='lista')b=`<div class="row sp">${qbox('cal','Filtrar por evento')}${add}</div>`+table([['Ocupação',x=>esc(x.n)],['Período',x=>per(x.a,x.b)],['Ambientes',x=>rnames(x.rooms)],['Tipo',x=>pill(TP[x.tp],{conf:'g',pre:'a',mont:'b',man:'r',bloq:'n'}[x.tp])]],qf('cal',bk.filter(x=>x.b>=HOJE).sort((a,b)=>a.a<b.a?-1:1),x=>x.n));
  return head(`Calendário único · pré-reserva vale ${P('pre')} dias`,'Calendário de espaços')+tb.html+b};
A.calym=d=>{let [y,m]=(U.calYm||'2026-11').split('-').map(Number);if(d.n==='0'){U.calYm='2026-11'}else{m+=+d.n;if(m<1){m=12;y--}if(m>12){m=1;y++}if(y*12+m<2026*12+1||y*12+m>2029*12+11)return;U.calYm=y+'-'+String(m).padStart(2,'0')}render()};
A.calgo=d=>{U.calYm=d.ym;U.tab.cal='mes';render()};
A.blk=()=>openForm('Nova pré-reserva ou bloqueio',[{k:'tp',l:'Tipo',t:'select',o:[['pre','Pré-reserva (expira em '+P('pre')+' dias)'],['bloq','Bloqueio'],['man','Manutenção']],v:'pre'},{k:'n',l:'Descrição',req:1},{k:'room',l:'Ambiente',t:'select',o:[['','Casa inteira']].concat(CALROOMS.map(r=>[r,room(r).n])),v:'ara'},{k:'a',l:'De',t:'date',v:addD(HOJE,30)},{k:'b',l:'Até',t:'date',v:addD(HOJE,31)}],'blk',null,'Registrar');
F.blk=v=>{if(v.b<v.a)v.b=v.a;const rooms=v.room?[v.room]:null,bk=bookings();const clash=days(v.a,v.b).map(d=>(rooms||CALROOMS).map(r=>busyOn(d,r,bk)).find(Boolean)).find(Boolean);
  S.blocksCal.push({id:uid(),a:v.a,b:v.b,tp:v.tp,n:v.n+(v.tp==='pre'?' (vale até '+brc(addD(HOJE,P('pre')))+')':''),rooms,dm:1});U.calYm=v.a.slice(0,7);U.tab.cal='mes';log('Registrou '+TP[v.tp].toLowerCase()+': '+v.n);toast(clash?'Registrado, mas há conflito com "'+clash.n+'". Veja o aviso na agenda.':'Registrado na agenda única.')};
A.blkdel=d=>{S.blocksCal=S.blocksCal.filter(b=>b.id!=d.id);save();render();toast('Data liberada.')};

// ------------------------------------------------------------ revenue management
V.rev=()=>{const bk=bookings(),sc=U.sc||{p:0,o:0};const base=5000000,cen=base*(1+sc.p/100)*(1+sc.o/100);
  const baixa=[9,10,11,12,1,2,3,4],dB=sum(baixa.map(m=>occ(2027,m,bk)[0])),tB=sum(baixa.map(m=>occ(2027,m,bk)[1]));const won=S.deals.filter(d=>['cass','sinal','oper'].includes(d.st)&&d.val);
  const free=MES.map((n,i)=>{const o=occ(2027,i+1,bk);return [n,o[1]-o[0],o[0]]}).filter(x=>x[2]===0||x[1]>25);
  return head('Preço, ocupação e receita por dia disponível','Revenue management',pill('Simulações não alteram a tabela','b'))+
  `<div class="grid g4">${kp('Receita bruta jan–set/2026',Rk(sum(REC)),'dado real · DRE',''," "+goM('fin','dre'))}${kp('Receita por dia do período',R(sum(REC)/273),'273 dias corridos')}${kp('Ocupação da baixa em 2027',N(dB/tB*100,0)+'%',dB+' de '+tB+' dias, set–abr','r',goM('cal','ano'))}${kp('Ticket médio contratado',Rk(sum(won.map(dval))/won.length),won.length+' contratos')}</div>
  <div class="grid g2"><div class="card"><h2>Cenário de preço e ocupação</h2><label class="field">Preço médio: <b style="color:var(--fg)">${sc.p>0?'+':''}${sc.p}%</b><input id="scp" type="range" min="-20" max="30" value="${sc.p}" data-a="sc" data-k="p"></label><label class="field">Dias vendidos: <b style="color:var(--fg)">${sc.o>0?'+':''}${sc.o}%</b><input id="sco" type="range" min="-20" max="100" step="5" value="${sc.o}" data-a="sc" data-k="o"></label>
   <div class="row sp"><span>Receita anual simulada</span><span class="tot">${Rk(cen)}</span></div><small>Base de cerca de R$ 5 mi por ano (Deck). Dobrar a ocupação da baixa temporada é a meta de 24 meses.</small></div>
  <div class="card"><h2>Recomendações</h2><div class="list">${S.recs.map(r=>`<div><span class="x">${r.t}<br><small>${r.st}</small></span>${r.st.startsWith('sugestão')?(is('com')?`<button class="btn ok" data-a="recok" data-id="${r.id}">Aprovar</button>`:pill('aguarda o Diretor Comercial','a')):pill('decisão aprovada','g')}</div>`).join('')}</div><small>Sugestão automática é só sugestão: vira decisão quando o Diretor Comercial aprova.</small></div></div>
  <div class="grid g2"><div class="card"><h2>Datas ociosas em 2027</h2>${table([['Mês',x=>x[0]],['Dias livres',x=>x[1],'n'],['Dias vendidos',x=>x[2],'n']],free)}</div>
  <div class="card"><h2>Preço de tabela por espaço</h2>${table([['Espaço',r=>r.n],['Diária',r=>R(S.preco[r.id]),'n'],['Por m²',r=>r.a?R(S.preco[r.id]/r.a):'—','n']],ROOMS.slice(0,8))}<small>Tabela ilustrativa ${pill('pendente de validação','a')}. Alta temporada ×${N(S.preco.alta,2)}; sexta e sábado ×${N(S.preco.fds,2)}.</small></div></div>
  <div class="card"><h2>Eventos recorrentes</h2>${table([['Evento',x=>x[0]],['Última edição',x=>x[1]],['Próxima',x=>x[2]],['Preferência de data',x=>pill(x[3],x[3]==='contratado'?'g':'a')]],[['Sociedade Brasileira de Dermatologia · RADESP','nov/2026','a negociar','sem contrato'],['ABHV','out/2026','a negociar','sem contrato'],['SOPATI','—','ago/2027','contratado'],['Sociedade Brasileira do Quadril','—','set/2027','contratado'],["L'Étape",'set/2026','set/2027','contratado'],['AASP','2026','ago/2027','reserva']])}<small>Meta proposta: renovação de congressos recorrentes de 80% ou mais.</small></div>`};
A.in_sc=(d,t)=>{U.sc=U.sc||{p:0,o:0};U.sc[d.k]=+t.value};
A.recok=d=>{const r=S.recs.find(x=>x.id==d.id);r.st='aprovada pelo Diretor Comercial';log('Aprovou a recomendação: '+r.t);save();render();toast('Recomendação aprovada. A tabela só muda quando a nova versão for publicada.')};

// ------------------------------------------------------------ programa de hospedagem
const blkCom=b=>{const tm=sum(S.hotels.map(h=>h.tar*(b.por[h.id]||0)));return b.conf*tm*P('comissao')/100};
V.hosp=()=>{const tb=tabs('hosp',[['blocos','Blocos por evento'],['hoteis','Hotéis aderentes'],['rel','Diárias e comissão']]);let b='';
  if(tb.cur==='blocos')b=table([['Evento',x=>esc(by('events',x.eid).n)+dm(x)],['Diárias no bloco',x=>x.n,'n'],['Confirmadas',x=>x.conf,'n'],['Ocupação',x=>`<div class="bar"><i style="width:${x.conf/x.n*100}%"></i></div>`],['Liberação',x=>br(x.lib)],['Comissão prevista',x=>R(blkCom(x)),'n']],S.blocks,{k:'blk'})+`<p class="note">A ordem de oferta ao cliente segue categoria e distância, nunca o vínculo com sócio. O bloco não confirmado é liberado 30 dias antes.</p>`;
  if(tb.cur==='hoteis')b=table([['Hotel',h=>h.n+dm(h)],['Categoria',h=>h.cat],['Vínculo',h=>h.vinc],['Tarifa de congresso',h=>R(h.tar),'n'],['Quartos no programa',h=>h.q,'n'],['Contrato de adesão',h=>pill(h.adesao?'assinado':'pendente',h.adesao?'g':'a')]],S.hotels)+`<p class="note">Contrato de adesão idêntico para todos: quartos, tarifa, prazo de liberação, comissão, early check-in e late check-out. Hotel de sócio é parte relacionada.</p>`;
  if(tb.cur==='rel'){const tot=sum(S.blocks.map(blkCom));b=`<div class="grid g3">${kp('Diárias confirmadas',sum(S.blocks.map(x=>x.conf)),'nos blocos ativos')}${kp('Comissão dos hotéis',R(tot),P('comissao')+'% das diárias · '+S.cfg.comissao.st.toLowerCase(),'g')}${kp('Receita líquida do Campos Hall',R(tot/2),'após cashback e transfer (hipótese: metade)')}</div>
    <div class="card"><h2>Diárias por hotel no trimestre</h2>${table([['Hotel',h=>h.n],['Vínculo',h=>h.vinc],['Diárias',h=>Math.round(sum(S.blocks.map(x=>x.conf*(x.por[h.id]||0)))),'n'],['Comissão',h=>R(sum(S.blocks.map(x=>x.conf*(x.por[h.id]||0)))*h.tar*P('comissao')/100),'n']],S.hotels)}<small>Este relatório vai ao Conselho Fiscal a cada trimestre.</small></div>`}
  return head('Congresso + hospedagem · regras iguais para todos os hotéis','Programa de hospedagem',DM)+tb.html+b};
DR.blk=id=>{const b=by('blocks',id),e=by('events',b.eid);return {t:'Bloco · '+esc(e.n),b:`<div class="card"><div class="list"><div><span class="x">Diárias no bloco</span><b>${b.n}</b></div><div><span class="x">Confirmadas</span><b>${b.conf}</b></div><div><span class="x">Liberação do saldo</span><b>${br(b.lib)}</b></div><div><span class="x">Link de reserva do evento</span><b>reservas.camposhall.demo/${e.id}</b></div></div>${table([['Hotel',h=>h.n],['Categoria',h=>h.cat],['Parte do bloco',h=>N((b.por[h.id]||0)*100,0)+'%','n'],['Diárias',h=>Math.round(b.conf*(b.por[h.id]||0)),'n']],S.hotels)}${is('coord','com','exec')?`<button class="btn" data-a="blkadd" data-id="${b.id}">Registrar 10 diárias confirmadas</button>`:''}<button class="lk" ${op('evento',e.id)}>abrir o evento</button></div>`}};

  <div class="card"><h2>Bloqueios por evento</h2>${table([['Evento',b=>esc(by('events',b.eid).n)],['Datas',b=>per(by('events',b.eid).a,by('events',b.eid).b)],['Diárias reservadas',b=>Math.round(b.n*b.por[h.id]),'n'],['Confirmadas',b=>Math.round(b.conf*b.por[h.id]),'n'],['Liberação',b=>br(b.lib)]],bs)}</div>
  <div class="grid g2"><div class="card"><h2>Tarifa e inventário</h2><label class="field">Tarifa de congresso (R$)<input id="htar" type="number" value="${h.tar}" data-a="htar"></label><label class="field">Quartos no programa<input id="hq" type="number" value="${h.q}" data-a="hq"></label><small>A tarifa de congresso fica abaixo do balcão e é revista por temporada.</small></div>
