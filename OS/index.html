A.ch_hsel=(d,t)=>{S.hotelId=+t.value};A.in_htar=(d,t)=>{by('hotels',S.hotelId).tar=+t.value||0};A.in_hq=(d,t)=>{by('hotels',S.hotelId).q=+t.value||0};
A.hadesao=()=>{by('hotels',S.hotelId).adesao=true;save();render();toast('Adesão registrada (assinatura simulada).')};

// ------------------------------------------------------------ marketing
V.mkt=()=>{const tb=tabs('mkt',[['painel','Painel'],['camp','Campanhas'],['edit','Calendário editorial'],['mat','Materiais e cases']]);const L=sum(S.camp.map(c=>c.leads)),Q=sum(S.camp.map(c=>c.qual)),Pp=sum(S.camp.map(c=>c.prop)),C=sum(S.camp.map(c=>c.custo));let b='';
  if(tb.cur==='painel'){const f=[['Leads',L],['Qualificados',Q],['Propostas',Pp],['Contratos',1]];b=`<div class="grid g4">${kp('Leads no trimestre',L,'todas as campanhas')}${kp('Custo por lead',R(C/L),'investimento de '+R(C))}${kp('Conversão em proposta',N(Pp/L*100,1)+'%')}${kp('Funil gerado',Rk(sum(S.camp.map(c=>c.pipe))),'oportunidades abertas','b',goM('crm','pipe'))}</div>
    <div class="card"><h2>Do marketing à receita</h2>${f.map(x=>`<div class="row sp"><span style="min-width:110px">${x[0]}</span><div class="bar" style="flex:1"><i style="width:${x[1]/L*100}%"></i></div><b style="min-width:40px;text-align:right">${x[1]}</b></div>`).join('')}<small>Cada lead guarda o canal de origem, então a receita de cada campanha aparece quando o contrato é assinado.</small></div>`}
  if(tb.cur==='camp')b=`<div class="row sp"><span></span>${is('mkt','com')?'<button class="btn pri" data-a="cnewc">Nova campanha</button>':''}</div>`+table([['Campanha',c=>esc(c.n)],['Canal',c=>c.canal],['Investimento',c=>R(c.custo),'n'],['Leads',c=>c.leads,'n'],['Custo por lead',c=>c.leads?R(c.custo/c.leads):'—','n'],['Funil gerado',c=>Rk(c.pipe),'n']],S.camp);
  if(tb.cur==='edit')b=`<div class="card"><div class="list">${[['Semana de 16/11','Case do RADESP 2026','aguarda autorização do cliente','a'],['Semana de 23/11','Guia: congresso + hospedagem na serra','aprovado','g'],['Semana de 30/11','Tour pelos espaços em vídeo','em produção','b'],['Dezembro','Calendário 2027 para organizadoras','a aprovar pelo Diretor Comercial','n']].map(x=>`<div><span class="x"><b>${x[1]}</b><br><small>${x[0]}</small></span>${pill(x[2],x[3])}</div>`).join('')}</div><small>Calendário mensal aprovado pelo Diretor Comercial. Evento de cliente só é divulgado com autorização escrita.</small></div>`;
  if(tb.cur==='mat')b=`<div class="grid g2"><div class="card"><h2>Kit técnico para RFP</h2><div class="list">${['Plantas e capacidades por formato','Lotação do AVCB','Energia, internet e áudio e vídeo','Docas e acessos','Hotéis parceiros'].map(x=>`<div><span class="x">${x}</span>${pill(x.startsWith('Plantas')?'aguarda plantas oficiais':'a montar','a')}</div>`).join('')}</div></div><div class="card"><h2>Cases</h2><div class="list">${['Sociedade Brasileira de Dermatologia','ABHV',"L'Étape"].map(x=>`<div><span class="x">${x}</span>${pill('pedir autorização','a')}</div>`).join('')}</div></div></div>`;
  return head('Agência sob o Diretor Comercial','Marketing e aquisição',DM)+tb.html+b};
A.cnewc=()=>openForm('Nova campanha',[{k:'n',l:'Nome',req:1},{k:'canal',l:'Canal',t:'select',o:['Google Ads','LinkedIn','E-mail','Evento presencial','Site'],v:'LinkedIn'},{k:'custo',l:'Investimento (R$)',t:'number',v:3000}],'cnewc');
F.cnewc=v=>{S.camp.push({id:uid(),n:v.n,canal:v.canal,custo:v.custo,leads:0,qual:0,prop:0,pipe:0,dm:1});U.tab.mkt='camp';toast('Campanha criada.')};

// ============================================================ operação: eventos, control tower, fornecedores, cozinha, qualidade, incidentes, patrimônio, portais
function fase(e){if(e.closed)return ['Encerrado','n'];if(e.open)return ['Em execução','g'];const dd=diff(HOJE,e.a);if(dd<=0&&HOJE<=e.b)return ['Dia D · a abrir','r'];if(dd<0)return ['Encerrado','n'];if(dd<=1)return ['D-1','r'];if(dd<=7)return ['D-7','a'];if(dd<=30)return ['D-30','a'];return ['Planejamento','b']}
const evProg=e=>{const tot=sum(MARCOS.map(m=>m[3].length));return [Object.values(e.done).filter(Boolean).length,tot]};
const evCusto=e=>sum(e.custos.map(c=>c[1]));
const lotacao=e=>e.rooms&&e.rooms.length?sum(e.rooms.map(r=>room(r).cap.aud||room(r).cap.rec||0)):4700;
const canOps=()=>is('ger','coord','sup');
V.eventos=()=>{const f=U.evf||'ativos';const list=S.events.filter(e=>f==='todos'||(f==='ativos'?!e.closed:!!e.closed)).sort((a,b)=>a.a<b.a?-1:1);
  return head('Uma página por evento · dono: Coordenador de Eventos','Eventos',`<div class="chips">${[['ativos','Em preparação e execução'],['enc','Encerrados'],['todos','Todos']].map(x=>`<button class="chip" aria-pressed="${f===x[0]}" data-a="evf" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>`)+
  `<div class="grid g3">${list.map(e=>{const p=evProg(e),fs=fase(e);return `<button class="card" ${op('evento',e.id)}><div class="row sp">${pill(fs[0],fs[1])}${e.dm?pill('demo'):''}</div><b>${esc(e.n)}</b><small>${per(e.a,e.b)} · ${rnames(e.rooms)}${e.pax?' · '+e.pax+' pessoas':''}</small><div class="bar"><i style="width:${p[0]/p[1]*100}%"></i></div><small>${p[0]} de ${p[1]} itens do checklist${S.inc.filter(i=>i.eid===e.id).length?' · '+S.inc.filter(i=>i.eid===e.id).length+' ocorrência(s)':''}</small></button>`}).join('')||'<p class="sm">Nenhum evento neste filtro.</p>'}</div>
  <p class="note">Contrato assinado no CRM cria o evento aqui, com os seis marcos do checklist e as tarefas de cada responsável.</p>`};
A.evf=d=>{U.evf=d.f;render()};
DR.evento=id=>{const e=by('events',id);if(!e)return null;const fs=fase(e),tb=tabs('ev',[['geral','Visão geral'],['crono','Cronograma'],['forn','Fornecedores'],['hosp','Hospedagem'],['custos','Resultado'],['ocorr','Ocorrências'],['aval','Avaliações'],['rel','Documentos e relatório']]);const co=canOps();let b='';const incs=S.inc.filter(i=>i.eid===id);
  if(tb.cur==='geral'){const d=by('deals',e.deal);b=`<div class="card"><div class="list"><div><span class="x">Cliente</span><b>${esc(e.cli)}</b></div><div><span class="x">Datas</span><b>${per(e.a,e.b)}</b></div><div><span class="x">Montagem</span><b>${e.mont} dia(s) antes</b></div><div><span class="x">Ambientes</span><b>${rnames(e.rooms)}</b></div><div><span class="x">Público contratado × lotação</span><b>${e.pax||'a confirmar'} × ${lotacao(e).toLocaleString('pt-BR')}</b></div>${d&&!is('cli')?`<div><span class="x">Contrato</span><button class="lk" ${op('deal',d.id)}>abrir no CRM</button></div>`:''}</div>
    ${e.pax>lotacao(e)?'<div class="banner r">Público contratado acima da lotação: nenhum evento acima do AVCB.</div>':''}</div>
    ${e.rooms&&e.rooms.length?`<div class="card"><h3>Planta</h3>${mapa({piso:room(e.rooms[0]).sub?1:0,sel:e.rooms,act:'noop'})}</div>`:''}
    <div class="card"><h3>Mensagens do cliente</h3>${e.msgs.length?`<div class="tl">${e.msgs.map(m=>`<div><b>${m[1]}</b>: ${esc(m[2])}<br><small>${br(m[0])}</small></div>`).join('')}</div>`:'<p class="sm">Nenhuma mensagem.</p>'}${co?`<button class="btn" data-a="emsg" data-id="${id}">Responder ao cliente</button>`:''}</div>`}
  if(tb.cur==='crono')b=MARCOS.map((m,i)=>{const due=m[1]==null?'':' · '+br(addD(m[1]>0?e.b:e.a,m[1]));return `<div class="card"><div class="row sp"><h3>${m[0]}${due}</h3><small>${rn(m[2])}</small></div>${m[3].map((t,j)=>`<label class="chk"><input type="checkbox" id="mk${id}_${i}_${j}" ${e.done[i+'_'+j]?'checked':''} ${co?'':'disabled'} data-a="mk" data-id="${id}" data-k="${i}_${j}"><span>${t}</span></label>`).join('')}</div>`}).join('');
  if(tb.cur==='forn'){const av=S.sup.filter(s=>s.st==='Homologado'||s.st==='Plano de melhoria');b=`<div class="card"><h3>Fornecedores do evento</h3>${e.forn.length?`<div class="list">${e.forn.map((f,i)=>{const s=by('sup',f.sid);return `<div><span class="x"><button class="lk" ${op('sup',s.id)}>${s.n}</button><br><small>${s.cat}</small></span>${pill('OS '+f.os,f.os==='confirmada'?'g':f.os==='emitida'?'b':'a')}${co&&f.os==='a emitir'?`<button class="btn" data-a="eos" data-id="${id}" data-i="${i}">Emitir OS</button>`:''}</div>`}).join('')}</div>`:'<p class="sm">Nenhum fornecedor escolhido ainda.</p>'}
    ${co?`<div class="row"><select id="addf${id}" aria-label="Fornecedor homologado">${av.filter(s=>!e.forn.some(f=>f.sid===s.id)).map(s=>`<option value="${s.id}">${s.n} · ${s.cat}</option>`).join('')}</select><button class="btn pri" data-a="eaddf" data-id="${id}">Incluir no evento</button></div>`:''}<small>Só fornecedor homologado e com documentação válida entra na escala. O cliente escolhe; a casa não ranqueia.</small></div>
    <div class="card"><h3>Catering</h3><p>${e.cater?`<button class="lk" ${op('sup',e.cater)}>${by('sup',e.cater).n}</button> usa a cozinha da casa.`:'O cliente ainda não escolheu o catering.'}</p><button class="btn" data-a="go" data-m="coz" data-t="chk">Checklists da cozinha</button></div>`}
  if(tb.cur==='hosp'){const k=S.blocks.find(x=>x.eid===id);b=`<div class="card">${k?`<div class="list"><div><span class="x">Diárias no bloco</span><b>${k.n}</b></div><div><span class="x">Confirmadas</span><b>${k.conf}</b></div><div><span class="x">Liberação</span><b>${br(k.lib)}</b></div><div><span class="x">Comissão prevista</span><b>${R(blkCom(k))}</b></div></div><button class="lk" ${op('blk',k.id)}>abrir o bloco</button>`:`<p class="sm">Sem bloco de hospedagem ativo.</p>${co||canSell()?`<button class="btn pri" data-a="eblk" data-id="${id}">Ativar bloco de hospedagem</button>`:''}`}<small>Transfer e early check-in ficam com o Coordenador de Eventos. Dados de hotéis são de demonstração.</small></div>`}
  if(tb.cur==='custos'){const c=evCusto(e),r=e.rec;b=`<div class="grid g4">${kp('Receita contratada',R(r.contr))}${kp('Faturada',R(r.fat))}${kp('Recebida',R(r.rec),r.rec<r.fat?'a receber: '+R(r.fat-r.rec):'',r.rec<r.fat?'a':'g')}${kp('Custos diretos',e.custos.length?R(c):'não apurados')}</div>
    <div class="card"><div class="row sp"><h3>Custos diretos</h3>${e.custos.length&&r.contr?pill('margem '+N((r.contr-c)/r.contr*100,0)+'%',(r.contr-c)/r.contr*100>=P('margem')?'g':'r'):''}</div>${e.custos.length?`<div class="list">${e.custos.map(x=>`<div><span class="x">${esc(x[0])}</span><b class="v">${R(x[1])}</b></div>`).join('')}</div>`:`<p class="sm">${e.dm?'Sem custos lançados.':'O custo por evento ainda não é apurado na contabilidade: a linha de custo direto por evento é uma das recomendações do painel.'}</p>`}${co||is('adm','fin')?`<button class="btn" data-a="ecusto" data-id="${id}">Lançar custo</button>`:''}</div>`}
  if(tb.cur==='ocorr')b=`<div class="card">${incs.length?`<div class="list">${incs.map(i=>`<button class="li" ${op('inc',i.id)}><span class="x"><b>${esc(i.t)}</b><br><small>${br(i.d)} ${i.h} · ${i.loc}</small></span>${pill(i.grav,i.grav==='grave'?'r':i.grav==='média'?'a':'n')}</button>`).join('')}</div>`:'<p class="sm">Nenhuma ocorrência registrada.</p>'}<button class="btn no" data-a="incnew" data-eid="${id}">Registrar ocorrência</button></div>`;
  if(tb.cur==='aval'){const n=S.nps.find(x=>x.eid===id);b=`<div class="card"><h3>Avaliação do cliente</h3>${n?`<div class="row sp"><span>Recomendaria o Campos Hall (0 a 10)</span><span class="tot">${n.n}</span></div>${n.txt?`<p class="sm">“${esc(n.txt)}”</p>`:''}`:`<p class="sm">${e.closed?'Pesquisa enviada; aguardando resposta do organizador.':'A pesquisa é enviada automaticamente quando o evento é encerrado.'}</p>`}</div>
    <div class="card"><h3>Avaliação dos fornecedores (0 a 10, em 48 h)</h3>${e.forn.length?`<div class="list">${e.forn.map(f=>{const s=by('sup',f.sid),ev=S.evals.find(x=>x.sid===f.sid&&x.eid===id);return `<div><span class="x">${s.n}<br><small>${s.cat}</small></span>${ev?pill('nota '+N(evNota(ev,s)),'g'):e.closed&&is('coord','ger')?`<button class="btn" data-a="aval" data-sid="${s.id}" data-eid="${id}">Avaliar</button>`:pill(e.closed?'pendente':'após o evento')}</div>`}).join('')}</div>`:'<p class="sm">Sem fornecedores neste evento.</p>'}</div>`}
  if(tb.cur==='rel'){const c=evCusto(e);b=`<div class="card"><h3>Pasta do evento</h3><div class="list">${['Contrato e aditivos','Briefing comercial','Planta e cronograma','ART e laudo de estruturas','Seguro do organizador','Ordens de serviço','Checklists assinados'].map((x,i)=>`<div><span class="x">${x}</span>${pill(i<2||e.closed?'na pasta':'pendente',i<2||e.closed?'g':'a')}</div>`).join('')}</div></div>
    <div class="card"><h3>Relatório pós-evento (D+2)</h3>${e.closed?`<div class="list"><div><span class="x">Público real × contratado</span><b>${e.publico||'não contado'} × ${e.pax||'—'}</b></div><div><span class="x">Receita contratada</span><b>${R(e.rec.contr)}</b></div><div><span class="x">Custos diretos</span><b>${e.custos.length?R(c):'não apurados'}</b></div><div><span class="x">Ocorrências</span><b>${incs.length}</b></div><div><span class="x">Nota do cliente</span><b>${(S.nps.find(x=>x.eid===id)||{}).n??'aguardando'}</b></div><div><span class="x">Fornecedores avaliados</span><b>${S.evals.filter(x=>x.eid===id).length} de ${e.forn.length}</b></div></div>`:'<p class="sm">Gerado quando o evento é encerrado: público, receita e custos, incidentes, notas, danos, diárias e lições.</p>'}</div>`}
  return {t:esc(e.n),b:`<div class="row">${pill(fs[0],fs[1])}${e.dm?pill('demo'):''}<small>${per(e.a,e.b)}</small>${is('sup','ger')&&!e.closed&&HOJE>=addD(e.a,-1)?`<button class="btn pri" data-a="go" data-m="torre">Abrir na control tower</button>`:''}</div>${tb.html}${b}`}};
A.noop=()=>{};
A.ch_mk=(d,t)=>{const e=by('events',d.id);e.done[d.k]=t.checked?1:0;if(t.checked)log('Marcou item do checklist de '+e.n)};
A.eaddf=d=>{const e=by('events',d.id),sid=+$('#addf'+d.id).value;if(!sid)return;e.forn.push({sid,os:'a emitir'});e.done['1_1']=1;log('Incluiu '+by('sup',sid).n+' em '+e.n);save();render();toast('Fornecedor incluído no planejamento do evento.')};
A.eos=d=>{const e=by('events',d.id),f=e.forn[+d.i];f.os='emitida';auto('Ordem de serviço','OS de '+e.n+' enviada a '+by('sup',f.sid).n);save();render();toast('Ordem de serviço emitida. O fornecedor confirma no portal dele.')};
A.eblk=d=>{const e=by('events',d.id);S.blocks.push({id:uid(),eid:e.id,n:200,conf:0,lib:addD(e.a,-30),dm:1,por:{1:.2,2:.4,3:.15,4:.25}});e.done['0_4']=1;save();render();toast('Bloco de hospedagem ativado com 200 diárias e liberação 30 dias antes.')};
A.ecusto=d=>openForm('Lançar custo direto',[{k:'t',l:'Descrição',req:1},{k:'v',l:'Valor (R$)',t:'number',v:1000}],'ecusto',+d.id);
F.ecusto=(v,id)=>{by('events',id).custos.push([v.t,v.v]);toast('Custo lançado: margem do evento recalculada.')};
A.emsg=d=>openForm(is('cli')?'Mensagem ao Campos Hall':'Responder ao cliente',[{k:'t',l:'Mensagem',t:'area',req:1}],'emsg',+d.id,'Enviar');
F.emsg=(v,id)=>{const e=by('events',id);e.msgs.push([HOJE,is('cli')?'Cliente':rn(me()),v.t]);if(is('cli'))task('Responder ao cliente de '+e.n,'coord',addD(HOJE,1),['evento',id]);toast('Mensagem registrada na página do evento.')};

// ------------------------------------------------------------ control tower
V.torre=()=>{const live=S.events.filter(e=>!e.closed&&e.a<=HOJE&&e.b>=HOJE);const next=S.events.filter(e=>!e.closed&&e.a>HOJE).sort((a,b)=>a.a<b.a?-1:1).slice(0,3);const e=live.find(x=>x.id===U.tev)||live[0];
  if(!e)return head('Operação ao vivo','Control tower')+`<div class="card"><p>Nenhum evento em execução hoje.</p></div><div class="card"><h3>Próximos</h3><div class="list">${next.map(x=>`<button class="li" ${op('evento',x.id)}><span class="x"><b>${esc(x.n)}</b><br><small>${per(x.a,x.b)}</small></span>${pill(fase(x)[0],fase(x)[1])}</button>`).join('')}</div></div>`;
  const ok=e.seg.filter(Boolean).length,all=ok===e.seg.length,incs=S.inc.filter(i=>i.eid===e.id),oss=S.os.filter(o=>o.eid===e.id),lot=lotacao(e),can=is('sup','ger');
  const tile=(l,v,c)=>`<div class="soft"><small>${l}</small><br><b class="t-${c}">${v}</b></div>`;
  return head('Operação ao vivo · '+br(HOJE),'Control tower',live.length>1?`<select id="tev" data-a="tev" aria-label="Evento">${live.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`:'')+
  `<div class="card"><div class="row sp"><div><b>${esc(e.n)}</b>${dm(e)}<br><small>${rnames(e.rooms)} · abertura 08:00 · encerramento 18:30</small></div>${pill(e.open?'Aberto às '+(e.openH||'08:02'):'Aguardando abertura',e.open?'g':'r')}</div>
   ${can?`<div class="row">${!e.open?`<button class="btn pri big" data-a="topen" data-id="${e.id}" ${all&&e.vist?'':'disabled'}>Abrir o evento</button>`:`<button class="btn big" data-a="tcount" data-id="${e.id}" data-n="50">+50 pessoas</button><button class="btn pri big" data-a="tclose" data-id="${e.id}">Encerrar o evento</button>`}<button class="btn no big" data-a="incnew" data-eid="${e.id}">Registrar ocorrência</button><button class="btn big" data-a="osnew" data-eid="${e.id}">Acionar manutenção</button></div>${!e.open&&!(all&&e.vist)?'<small>Para abrir: conclua o checklist de segurança e registre a vistoria com foto.</small>':''}`:''}</div>
  <div class="grid g4">${tile('Público registrado × lotação',`${e.publico} × ${lot.toLocaleString('pt-BR')}`,e.publico>lot?'r':'g')}${tile('Previsto em contrato',e.pax,'n')}${tile('Checklist de segurança',`${ok} de ${e.seg.length}`,all?'g':'a')}${tile('Vistoria de entrega',e.vist?'registrada':'pendente',e.vist?'g':'a')}${tile('Ocorrências',incs.length,incs.length?'a':'g')}${tile('Chamados de manutenção',oss.filter(o=>o.st!=='concluída'&&o.st!=='avaliada').length+' abertos',oss.some(o=>o.st!=='concluída'&&o.st!=='avaliada')?'a':'g')}${tile('Internet · energia · cozinha','operando (demo)','g')}${tile('Brigada e segurança',e.seg[4]?'presentes':'a confirmar',e.seg[4]?'g':'a')}</div>
  <div class="grid g2"><div class="card"><div class="row sp"><h2>Checklist de segurança do dia</h2>${can&&!all?`<button class="btn" data-a="tall" data-id="${e.id}">Marcar todos como conferidos</button>`:''}</div><div class="bar"><i style="width:${ok/e.seg.length*100}%;background:var(--green)"></i></div>
    ${SEG.map((t,i)=>`<label class="chk"><input type="checkbox" id="sg${e.id}_${i}" ${e.seg[i]?'checked':''} ${can?'':'disabled'} data-a="sg" data-id="${e.id}" data-i="${i}"><span>${t}</span></label>`).join('')}
    <div class="row sp"><span>${e.vist?foto(e.vist)+' <small>Vistoria assinada pelo supervisor</small>':'<small>Vistoria de entrega do espaço ainda não registrada.</small>'}</span>${can&&!e.vist?`<button class="btn pri" data-a="tvist" data-id="${e.id}">Registrar vistoria com foto</button>`:''}</div></div>
   <div class="grid"><div class="card"><h2>Fornecedores no evento</h2><div class="list">${e.forn.map(f=>{const s=by('sup',f.sid);return `<div><span class="x">${s.n}<br><small>${s.cat}</small></span>${pill(f.os==='confirmada'?'presente':'OS '+f.os,f.os==='confirmada'?'g':'a')}</div>`}).join('')||'<small>Sem fornecedores.</small>'}</div></div>

function npsCalc(rs){if(!rs.length)return null;const p=rs.filter(r=>r.n>=9).length,d=rs.filter(r=>r.n<=6).length;return Math.round((p-d)/rs.length*100)}

  return head('NPS = % de promotores − % de detratores','Satisfação e qualidade',DM)+
  `<div class="grid g4">${kp('NPS dos organizadores',n==null?'—':n,'meta proposta: '+P('nps'),n>=P('nps')?'g':'a')}${kp('Promotores (9 e 10)',rs.filter(r=>r.n>=9).length,'de '+rs.length+' respostas','g')}${kp('Detratores (0 a 6)',rs.filter(r=>r.n<=6).length,'','r')}${kp('Pesquisas sem resposta',pend.length,'cobrar em D+2','a')}</div>
  <div class="grid g2"><div class="card"><h2>Nota por dimensão</h2>${NPSQ.map(q=>{const v=rs.filter(r=>r.notas[q[0]]!=null).map(r=>r.notas[q[0]]),m=v.length?sum(v)/v.length:0;return `<div class="row sp"><span style="min-width:150px">${q[1]}</span><div class="bar" style="flex:1"><i style="width:${m*10}%;background:${m>=P('nota')?'var(--green)':m>=8?'var(--blue)':'var(--amber)'}"></i></div><b style="min-width:34px;text-align:right">${v.length?N(m):'—'}</b></div>`}).join('')}<small>Meta operacional: nota de ${P('nota')} ou mais.</small></div>
  <div class="card"><h2>Planos de ação</h2>${plans.length?`<div class="list">${plans.map(p=>`<div><span class="x"><b>${esc(p.t)}</b><br><small>${esc(p.orig)}${p.acao?' · ação: '+esc(p.acao)+' · prazo '+br(p.prazo):''}</small></span>${p.st==='aberto'&&is('ger')?`<button class="btn pri" data-a="plan" data-id="${p.id}">Definir ação</button>`:p.st==='em andamento'&&is('ger','coord')?`<button class="btn ok" data-a="planok" data-id="${p.id}">Concluir</button>`:pill(p.st,p.st==='concluído'?'g':'a')}</div>`).join('')}</div>`:'<p class="sm">Nenhum plano aberto. Nota 6 ou menor em qualquer pergunta abre um plano e uma tarefa para o Gerente de Operações.</p>'}</div></div>
  <div class="card"><h2>Respostas</h2>${table([['Evento',r=>r.eid?esc(by('events',r.eid).n):r.lbl],['Recomendaria',r=>`<b>${r.n}</b>`,'n'],['Grupo',r=>pill(r.n>=9?'promotor':r.n>=7?'neutro':'detrator',r.n>=9?'g':r.n>=7?'n':'r')],['Comentário',r=>esc(r.txt||'—')]],rs)}</div>
  ${pend.length?`<div class="card"><h2>Aguardando resposta</h2><div class="list">${pend.map(e=>`<button class="li" ${op('evento',e.id)}><span class="x">${esc(e.n)}<br><small>encerrado em ${br(e.closed)}</small></span>${pill('pesquisa enviada','a')}</button>`).join('')}</div></div>`:''}`};
A.plan=d=>openForm('Definir ação',[{k:'acao',l:'Ação',t:'area',req:1},{k:'prazo',l:'Prazo',t:'date',v:addD(HOJE,14)},{k:'dono',l:'Responsável',t:'select',o:[['coord','Coordenador de Eventos'],['sup','Supervisor Operacional'],['exec','Executivo de Contas']],v:'coord'}],'plan',+d.id);

  if(tb.cur==='caixa'){const ds=[...new Set(pagAb().map(p=>p.venc).concat(recAb().filter(r=>r.venc>=HOJE).map(r=>r.venc)))].filter(d=>d<='2026-12-15').sort();const rows=ds.map(d=>({d,e:sum(recAb().filter(r=>r.venc===d).map(r=>r.v)),s:sum(pagAb().filter(p=>p.venc===d).map(p=>p.v))}));const rg=S.aprov.find(a=>a.kind==='resg');
   b=`<div class="grid g3">${kp('Conta corrente em 09/11',Rk(CX.cc),'','r')}${kp('Aplicações',Rk(CX.aplic),'reserva de liquidez')}${kp('Saídas programadas até 09/12',Rk(sum(pagAb().map(p=>p.v))))}</div>

  if(tb.cur==='rec')b=`<div class="grid g3">${kp('Carteira',Rk(car))}${kp('Vencidos',Rk(ve),N(ve/car*100,0)+'% · meta abaixo de '+P('venc')+'%','r')}${kp('A vencer',Rk(car-ve))}</div><div class="card">${table([['Título',r=>r.n+(r.obs?`<br><small>${r.obs}</small>`:'')],['Vencimento',r=>br(r.venc)],['Valor',r=>R(r.v),'n'],['Situação',r=>r.st==='recebido'?pill('recebido','g'):r.venc<POS?pill(diff(r.venc,HOJE)+' dias vencido','r'):pill('a vencer','n')],['',r=>r.st==='aberto'&&canFin()?`<span class="row">${r.venc<POS?`<button class="btn" data-a="cobrar" data-id="${r.id}">Cobrar</button>`:''}<button class="btn ok" data-a="baixar" data-id="${r.id}">Baixar</button></span>`:(r.cob?`<small>cobrado em ${brc(r.cob)}</small>`:'')]],S.receber)}</div><p class="note">Carteira na posição de 10/11. Régua de cobrança proposta: aviso em D+1, ligação em D+7, diretoria em D+30 e protesto ou acordo em D+60.</p>`;
  if(tb.cur==='pag')b=`<div class="card">${table([['Conta',p=>p.n],['Centro de custo',p=>p.cc],['Vencimento',p=>br(p.venc)],['Valor',p=>R(p.v),'n'],['Aprovação',p=>p.v>P('dupla')?pill('dupla','a'):pill('simples','n')],['',p=>{const a=S.aprov.find(x=>x.kind==='pag'&&x.ref===p.id);return p.st==='pago'?pill('pago','g'):a&&a.st==='pend'?pill('em aprovação','a'):a&&a.st==='no'?pill('recusado','r'):is('adm','fin')?`<button class="btn" data-a="pagar" data-id="${p.id}">${p.v>P('dupla')&&!(a&&a.st==='ok')?'Pedir aprovação':'Pagar'}</button>`:pill('aberto','n')}]],S.pagar)}</div><p class="note">Pagamento acima de ${R(P('dupla'))} exige dupla aprovação: financeiro e executivo da área (${pst('dupla')}). Quem solicita não aprova.</p>`;

  return [{id:'rec',l:'Receita de janeiro a setembro',v:Rk(sum(REC)),s:'real',c:'',m:'fin',t:'dre',rows:REC.map((r,i)=>[MES[i]+'/26',R(r)])},
   {id:'ebi',l:'EBITDA',v:Rk(sum(EBI)),s:'margem de '+N(sum(EBI)/sum(REC)*100,0)+'%',c:'g',m:'fin',t:'dre',rows:EBI.map((r,i)=>[MES[i]+'/26',R(r)])},
   {id:'cx',l:'Caixa em 31/10',v:Rk(CX.caixa),s:'conta corrente: '+Rk(CX.cc),c:'',m:'fin',t:'caixa',rows:[['Aplicações',R(CX.aplic)],['Conta corrente em 09/11',R(CX.cc)],['A pagar até 09/12',R(sum(pagAb().map(p=>p.v)))]]},

   {id:'occ',l:'Ocupação de novembro',v:N(oc[0]/oc[1]*100,0)+'%',s:oc[0]+' de '+oc[1]+' dias',c:'',m:'cal',rows:[10,11,12].map(m=>{const o=occ(2026,m,bk);return [MES[m-1]+'/26',o[0]+' de '+o[1]+' dias']}).concat([1,2,3,4].map(m=>{const o=occ(2027,m,bk);return [MES[m-1]+'/27',o[0]+' de '+o[1]+' dias']}))},
   {id:'pipe',l:'Pipeline aberto',v:Rk(pipeVal()),s:'ponderado: '+Rk(pipePond()),c:'',m:'crm',t:'pipe',rows:STG.slice(0,9).map(s=>[s[1],S.deals.filter(d=>d.st===s[0]).length+' · '+Rk(sum(S.deals.filter(d=>d.st===s[0]).map(dval)))])},

   {id:'mg',l:'Margem média por evento',v:cls.length?N(sum(cls.map(e=>(e.rec.contr-evCusto(e))/e.rec.contr*100))/cls.length,0)+'%':'—',s:'só eventos demo com custo lançado',c:'',m:'fin',t:'ev',rows:cls.map(e=>[e.n,N((e.rec.contr-evCusto(e))/e.rec.contr*100,0)+'%'])},
   {id:'forn',l:'Fornecedores homologados',v:S.sup.filter(s=>s.st==='Homologado').length,s:S.sup.filter(s=>s.st==='Plano de melhoria').length+' em plano de melhoria · demo',c:'',m:'forn',t:'score',rows:S.sup.map(s=>[s.n,s.st])},
   {id:'comp',l:'Compliance em vermelho',v:compR().length,s:'de 23 obrigações',c:'r',m:'comp',rows:compR().concat(compA()).map(c=>[c.n,CL[c.st][0]])},

V.demo=()=>{const tb=tabs('demo',[['rot','Roteiro'],['fases','Implantação em fases'],['inv','Inventário de telas'],['reg','Regras adotadas'],['pend','Pendências e limites']]);let b='';

  if(tb.cur==='rot')b=`<div class="card"><div class="row sp"><div><h2>Apresentação guiada em 10 passos</h2><p class="sm">Cerca de 15 minutos. Cada passo abre o perfil e a tela certos e diz o que observar.</p></div><button class="btn pri big" data-a="tour" data-n="0">Iniciar a apresentação</button></div></div><div class="grid g2">${JOR.map(j=>`<div class="card"><h3>${j[0]}</h3><div class="list">${j[1].map(s=>`<button class="li" data-a="as" data-r="${s[1]}" data-m="${s[2]}"><span class="x">${s[0]}<br><small>${rn(s[1])} · ${MOD[s[2]][0]}</small></span>${pill('abrir','b')}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="card"><h3>Cenários prontos na base</h3><div class="list">${[['Congresso médico com contrato enviado','deal',14],['Feira com múltiplos ambientes em negociação','deal',13],['Desconto aguardando alçada','deal',2],['Convenção acontecendo hoje','evento',1],['Evento em D-7','evento',2],['Evento encerrado aguardando avaliações','evento',6],['Fornecedor em homologação','sup',3],['Fornecedor com não conformidade','sup',9],['Fornecedor ligado a sócio','sup',12],['Compra aguardando aprovação','aprov',903],['Licença perto do vencimento','comp',6],['Reunião com deliberações pendentes','meet',2]].map(c=>`<button class="li" ${op(c[1],c[2])}><span class="x">${c[0]}</span>${pill('ver','n')}</button>`).join('')}</div></div>
   <button class="btn no" data-a="reset">Reiniciar a demonstração</button>`;
  if(tb.cur==='inv')b=`<div class="card">${table([['Perfil',r=>`<b>${r.n}</b><br><small>${r.g}</small>`],['Telas',r=>r.mods.map(m=>MOD[m][0]).join(' · ')],['',r=>`<button class="btn" data-a="as" data-r="${r.id}">Entrar</button>`]],ROLES)}</div><div class="card"><h3>Abas por módulo</h3>${table([['Módulo',m=>MOD[m][0]],['Abas e passos',m=>TABS[m]]],Object.keys(TABS))}</div><div class="card"><h3>Painéis de detalhe</h3><p class="sm">Oportunidade, proposta em PDF demonstrativo, evento, bloco de hospedagem, fornecedor, ocorrência, ativo, ordem de serviço, obrigação de compliance, reunião, aprovação, tarefa, pessoa e indicador.</p></div>`;
  if(tb.cur==='reg')b=`<div class="card">${table([['Regra',k=>S.cfg[k].l],['Valor adotado',k=>S.cfg[k].u==='R$'?R(S.cfg[k].v):S.cfg[k].v?S.cfg[k].v+' '+S.cfg[k].u:'—','n'],['Situação',k=>pst(k)],['Origem',k=>`<small>${S.cfg[k].src}</small>`]],Object.keys(S.cfg))}</div><div class="card"><h3>Outras regras do protótipo</h3><div class="list">${[['Estrutura: três diretores estatutários e dois executivos, sem copresidência','Proposto'],['Sócio não atribui tarefa à equipe','Proposto'],['Homologação: mínimo de 70 pontos (30/25/20/15/10)','Proposto'],['Avaliação de fornecedor: pesos 20/25/15/20/10/10; buffet com nota do nutricionista','Proposto'],['Faixas do scorecard: 8 ou mais, de 6 a 7,9, abaixo de 6','Proposto'],['SLA comercial: 24 h, 48 h, 72 h e 7 dias','Proposto'],['NPS = % de promotores − % de detratores','Definição padrão'],['Tabela de preços e sazonalidade','Ilustrativo'],['Sete deliberações da assembleia','Proposto · não aprovado']].map(x=>`<div><span class="x">${x[0]}</span>${pill(x[1],x[1]==='Definição padrão'?'g':x[1]==='Ilustrativo'?'a':'b')}</div>`).join('')}</div></div>`;
  if(tb.cur==='pend')b=`<div class="grid g2"><div class="card"><h3>Dependências para a versão de produção</h3><div class="list">${['Plantas oficiais do térreo e do piso inferior (os arquivos do site não puderam ser baixados)','Fotos oficiais dos espaços','Tabela de preços aprovada e regras de sazonalidade','Contrato-padrão e termo de adesão dos fornecedores','Validação jurídica dos quóruns e das alçadas','Percentual de comissão e contrato de adesão dos hotéis','Área do Centro de Exposições e capacidades do piso inferior','Exigências locais de licenciamento e faixas de temperatura da cozinha','Escolha das integrações: contabilidade, banco, nota fiscal, assinatura'].map(x=>`<div><span class="x">${x}</span></div>`).join('')}</div></div>
   <div class="card"><h3>Limites deste protótipo</h3><div class="list">${['Mapa esquemático com as medidas oficiais, não a planta arquitetônica','Preços, fornecedores, hotéis, pessoas, campanhas e parte dos eventos são fictícios e trazem a etiqueta “demo”','Financeiro real até setembro (DRE) e posição de caixa e carteira de 10/11; o restante é simulado','PDF, assinatura, e-mails, pagamentos e QR Code são simulados: nada é enviado nem movimentado','Copilotos respondem por regras fixas, sem modelo de IA conectado','Os dados ficam só neste navegador; não há login, banco de dados nem uso simultâneo','Os números financeiros estão fixos no protótipo; em produção vêm do mesmo banco que alimenta o Painel de Governança','Sete das 23 obrigações de compliance foram reconstituídas e devem ser conferidas com o Playbook'].map(x=>`<div><span class="x">${x}</span></div>`).join('')}</div></div></div>`;
  return head('Para a apresentação ao conselho','Roteiro da demonstração','','Oito jornadas, cada passo abre o perfil e a tela certos. O seletor de perfil no menu troca de cargo a qualquer momento.')+tb.html+b};

// ------------------------------------------------------------ início do sócio em uma tela: dinheiro, decisões, riscos
const homeGen=V.home;
V.home=()=>{if(!is('socio'))return homeGen();const ve=sum(vencidos().map(r=>r.v)),car=sum(recAb().map(r=>r.v)),vt=S.votes.filter(v=>v.meu==null).length,m=S.meetings.find(x=>x.rito===5&&!x.ata);
  const li=(a,b,c)=>`<div><span class="x">${a}</span><b class="v ${c?'t-'+c:''}">${b}</b></div>`;
  return head(br(HOJE)+' · visão do sócio','Campos Hall em uma tela',`<button class="btn" data-a="guide">Roteiro da demonstração</button>`)+
  `<div class="grid g3"><div class="card"><h2>Como está o dinheiro</h2><div class="list">${li('Resultado de janeiro a setembro',Rk(sum(RES)),'g')}${li('Caixa em 31/10',Rk(CX.caixa))}${li('Conta corrente em 09/11',Rk(CX.cc),'r')}${li('Carteira vencida',N(ve/car*100,0)+'% · '+Rk(ve),'r')}</div><div class="banner r">Sem resgate da aplicação, a conta corrente fica negativa em 24/11.</div>${bars(REC,MES,v=>Math.round(v/1e3))}<small>Receita por mês, em R$ mil.</small><button class="btn" ${goM('bi')}>Abrir os indicadores</button></div>
  <div class="card"><h2>O que preciso decidir</h2><p class="sm">${vt?vt+' de 7 deliberações aguardam o seu voto antecipado.':'Você já registrou o voto nas sete deliberações.'}${m?' Assembleia em '+br(m.d)+'.':''}</p><div class="list">${S.votes.map(v=>`<button class="li" ${goM('gov','vot')}><span class="x">${v.id}. ${v.t}</span>${v.meu==null?pill('votar','b'):pill(['contra','a favor','abstenção'][v.meu],'n')}</button>`).join('')}</div><button class="btn pri" ${goM('gov','cons')}>O que cada decisão destrava</button></div>
  <div class="card"><h2>O que está em risco</h2><div class="list">${compR().map(c=>al(c.n+'<br><small>'+c.obs+'</small>','r',op('comp',c.id),'irregular')).join('')}${al('Recebimentos de outubro sem contrato assinado<br><small>R$ 169,8 mil</small>','a',goM('fin'),'atenção')}${al('Partes relacionadas sem registro concluído<br><small>'+S.rp.filter(r=>r.c!=='g').length+' itens</small>','a',goM('gov','rp'),'atenção')}${al('Diretor Comercial e Gerente de Operações<br><small>cargos em seleção</small>','b',goM('gov','ritos'),'em curso')}</div><button class="btn" ${goM('comp')}>Abrir compliance</button></div></div>
  <div class="banner b">O sócio acompanha, delibera e fiscaliza. Pedidos à equipe passam pela diretoria e pelo comitê executivo: este perfil não cria tarefas operacionais.</div>`};

// ------------------------------------------------------------ o que o conselho precisa aprovar
const DESTRAVA=['As políticas passam a “Vigente”: alçadas, partes relacionadas, homologação e penalidades','Os perfis de Presidente, Vice-Presidente e Adm.-Financeiro ganham titulares; aprovações saem com nome','A verba da diretoria entra no orçamento e no acompanhamento mensal','O perfil do Conselho Fiscal e o parecer trimestral passam a valer','A rota de aprovação de gastos e compras deixa de ser simulação','Verbas por área, controle de desvio e fim da alçada provisória','Compra dos equipamentos da cozinha, licença sanitária e operação dos cinco buffets'];
function consHTML(){return `<div class="banner">O sistema só funciona de verdade depois destas decisões. Hoje tudo abaixo roda como proposta.</div>
  <div class="card"><h2>Sete deliberações da assembleia</h2>${table([['Deliberação',v=>`<b>${v.id}. ${v.t}</b><br><small>base: ${v.base}</small>`],['O que destrava no sistema',v=>DESTRAVA[v.id-1]],['Situação',v=>pill(v.st||'Proposto','b')]],S.votes)}<button class="btn pri" ${goM('gov','vot')}>Ir para a votação</button></div>
  <div class="card"><h2>Definições que não dependem da assembleia</h2>${table([['Definição',d=>d[0]],['Quem define',d=>d[1]],['Sem ela',d=>d[2]]],[['Tabela de preços e sazonalidade','Diretor Comercial, com a diretoria','O simulador mostra valores ilustrativos'],['Contrato-padrão e termo de adesão de fornecedores','Jurídico','Proposta e homologação não geram documento válido'],['Quóruns de cada deliberação','Jurídico','A votação mostra quóruns a confirmar'],['Comissão e contrato de adesão dos hotéis','Diretoria e hotéis','O programa de hospedagem fica em hipótese'],['Custo direto por evento na contabilidade','Diretor Adm.-Financeiro','A margem por evento não é apurada'],['Plantas oficiais e fotos','Marketing','O mapa segue esquemático']])}</div>`}

// ------------------------------------------------------------ implantação em fases (proposta)
function fasesHTML(){const F=[['Fase 1 · primeiros 60 dias','Vender, entregar e enxergar o dinheiro',['CRM, propostas e calendário de espaços','Página do evento com os seis marcos','Control tower no celular','Financeiro em leitura e indicadores','Tarefas e aprovações'],['exec','com','coord','sup','fin','pres','socio']],['Fase 2 · de 60 a 120 dias','Qualidade, compras e conformidade',['Fornecedores: homologação e scorecard','Cozinha e catering','Satisfação e NPS','Compras e contas a pagar','Compliance e patrimônio','Portal do cliente'],['ger','adm','man','nutri','vice','cf','cli']],['Fase 3 · depois de 120 dias','Portais externos e automação',['Portais do fornecedor e do hotel','Revenue management','Marketing','Copilotos com IA conectada','Integrações: contabilidade, banco, nota fiscal, assinatura'],['forn','hotel','mkt','admin']]];
  return `<div class="banner b">Proposta de implantação. Começar por sete perfis reduz o risco e o treinamento; os demais entram quando a base estiver em uso.</div><div class="grid g3">${F.map(f=>`<div class="card"><h2>${f[0]}</h2><p class="sm">${f[1]}</p><div class="list">${f[2].map(x=>`<div><span class="x">${x}</span></div>`).join('')}</div><h3>Perfis</h3><div class="row">${f[3].map(r=>`<button class="chip" data-a="as" data-r="${r}">${rn(r)}</button>`).join('')}</div></div>`).join('')}</div><p class="note">Prazos indicativos, a confirmar depois da aprovação do protótipo e da escolha das integrações.</p>`}

// ------------------------------------------------------------ apresentação guiada
const TOUR=[['pub','site',null,null,'O site que vende o espaço','Números da casa, planta clicável e capacidades. A chamada principal leva ao simulador.'],
 ['pub','calc',null,null,'Simulador de preço','Em sete passos o cliente escolhe salas no mapa, datas e hospedagem e vê o preço. Os valores são ilustrativos até existir tabela aprovada.'],
 ['exec','crm','pipe',null,'O pedido vira oportunidade','O lead do site entra no funil com salas, datas e valor, e o Executivo de Contas recebe a tarefa de responder em 24 horas.'],
 ['com','aprov','fila',null,'Desconto passa pela alçada','Acima de 15% o desconto vai ao Diretor Comercial. Quem pede não aprova, e a trilha guarda quem decidiu.'],
 ['coord','eventos',null,['evento',2],'Uma página por evento','Contrato assinado cria o evento com os seis marcos, de D-30 a D+2. Cada item tem responsável.'],
 ['sup','torre',null,null,'O dia do evento, no celular','Checklist de segurança, vistoria com foto, contagem de público, ocorrência e manutenção em três botões.'],
 ['ger','forn','score',null,'Fornecedor medido a cada evento','Homologação por pontos, nota depois de cada evento e faixas claras: manter, plano de melhoria ou suspensão.'],
 ['fin','fin','visao',null,'O dinheiro em uma tela','Caixa, carteira, a pagar e os pontos do fechamento. Os números são os mesmos do Painel de Governança.'],
 ['vice','comp',null,null,'23 obrigações com semáforo','Cinza quer dizer “sem documento”, não “em ordem”. Cada item tem dono, validade e plano de ação.'],
 ['socio','home',null,null,'A visão do sócio','Três perguntas em uma tela: como está o dinheiro, o que preciso decidir e o que está em risco.']];
A.tour=d=>{const n=+d.n;if(isNaN(n)||n<0||n>=TOUR.length){S.tour=null;save();render();return}const t=TOUR[n];S.tour=n;S.role=t[0];S.mod=t[1];if(t[2])U.tab[t[1]]=t[2];if(t[1]==='calc')S.calc.step=2;if(t[4]==='Uma página por evento')U.tab.ev='crono';U.drawer=t[3]?{k:t[3][0],id:t[3][1]}:null;U.more=false;U.form=null;save();render();scrollTo(0,0)};
HOOK.after=()=>{if(S.tour==null)return;const n=S.tour,t=TOUR[n];const dw=document.querySelector('.drawer');if(dw)dw.style.paddingBottom='240px';document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="tour-sp"></div><div class="tour" role="region" aria-label="Apresentação guiada"><div class="tx"><small>Passo ${n+1} de ${TOUR.length} · ${rn(t[0])}</small><b>${t[4]}</b><span>${t[5]}</span></div><div class="row"><button class="btn" data-a="tour" data-n="${n-1}" ${n?'':'disabled'}>Anterior</button>${n<TOUR.length-1?`<button class="btn pri" data-a="tour" data-n="${n+1}">Próximo</button>`:`<button class="btn pri" data-a="tour" data-n="99">Concluir</button>`}<button class="btn" data-a="tour" data-n="-1" aria-label="Sair da apresentação">Sair</button></div></div>`)};

load();render();


</script>
